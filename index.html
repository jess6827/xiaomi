<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小祕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f3f4f6;padding:16px;padding-bottom:140px}
.anim-area{text-align:center;color:#999;margin-bottom:12px;font-size:14px}
.history-wrap{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #00000012}
.history-title{text-align:center;font-size:16px;color:#666;margin-bottom:12px;cursor:pointer;text-align:center}
.chat-box{display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:12px 14px;border-radius:16px;line-height:1.5;font-size:15px}
.msg.user{background:#22c55e;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.ai{background:#f1f1f1;color:#222;align-self:flex-start;border-bottom-left-radius:4px}
.ctrl-bar{display:flex;justify-content:space-around;background:#fff;border-radius:20px;padding:14px 8px;margin:12px 0;box-shadow:0 2px 10px #00000012}
.ctrl-item{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:#444;cursor:pointer}
.ctrl-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.input-wrap{position:fixed;bottom:16px;left:16px;right:16px;background:#fff;border-radius:24px;padding:10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px #00000018}
#input{flex:1;border:none;outline:none;font-size:16px;padding:8px 4px}
#voiceBtn{width:44px;height:44px;border-radius:50%;border:none;background:#eee;color:#222;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#sendBtn{width:44px;height:44px;border-radius:50%;border:none;background:#22c55e;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;display:none}
.voice-tip{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:12px;display:none;white-space:nowrap}
</style>
</head>
<body>
<div class="anim-area">【小祕半身動畫區】</div>
<div class="history-wrap">
  <div class="history-title">▼ 歷史紀錄</div>
  <div class="chat-box" id="chat"></div>
</div>
<div class="ctrl-bar">
  <div class="ctrl-item" onclick="openCam()">
    <div class="ctrl-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
        <circle cx="12" cy="13" r="3"></circle>
      </svg>
    </div>
    <span>相機</span>
  </div>
  <div class="ctrl-item" onclick="openGallery()">
    <div class="ctrl-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <path d="M21 15l-5-5L5 21"></path>
      </svg>
    </div>
    <span>圖庫</span>
  </div>
  <div class="ctrl-item" onclick="openSkin()">
    <div class="ctrl-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 7l-3-4H7L4 7h2v11h12V7h2z"></path>
        <path d="M9 9v10"></path>
        <path d="M15 9v10"></path>
      </svg>
    </div>
    <span>皮膚</span>
  </div>
  <div class="ctrl-item" onclick="openSetting()">
    <div class="ctrl-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>
    <span>設定</span>
  </div>
</div>
<div class="input-wrap">
  <button id="voiceBtn">🎤</button>
  <input id="input" placeholder="輸入文字" oninput="switchBtn()">
  <button id="sendBtn">➤</button>
</div>
<div class="voice-tip" id="voiceTip">按住說話，放開送出</div>
<script>
const chatDom = document.getElementById('chat');
const inputDom = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const voiceBtn = document.getElementById('voiceBtn');
const voiceTip = document.getElementById('voiceTip');
let isVoiceMode = false;

// 核心切換邏輯：有文字顯示發送，空了回到麥克風
function switchBtn(){
  if(inputDom.value.trim() !== ''){
    sendBtn.style.display = 'flex';
    voiceBtn.style.display = 'none';
  }else{
    sendBtn.style.display = 'none';
    voiceBtn.style.display = 'flex';
  }
}
// 發送文字
sendBtn.onclick = ()=>{
  const txt = inputDom.value.trim();
  if(!txt) return;
  addMsg(txt, 'user');
  inputDom.value = '';
  switchBtn();
}
// 語音長按
voiceBtn.addEventListener('touchstart', startVoice);
voiceBtn.addEventListener('touchend', endVoice);
voiceBtn.addEventListener('mousedown', startVoice);
voiceBtn.addEventListener('mouseup', endVoice);
voiceBtn.addEventListener('mouseleave', endVoice);

function startVoice(){
  isVoiceMode = true;
  voiceTip.style.display = 'block';
}
function endVoice(){
  if(!isVoiceMode) return;
  isVoiceMode = false;
  voiceTip.style.display = 'none';
  switchBtn();
}
function addMsg(text,type){
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerText = text;
  chatDom.appendChild(div);
  chatDom.scrollTop = chatDom.scrollHeight;
}
function openCam(){alert('開啟相機')}
function openGallery(){alert('開啟圖庫')}
function openSkin(){alert('切換皮膚')}
function openSetting(){alert('開啟設定，填入API Key')}
</script>
</body>
</html>
