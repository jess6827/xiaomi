<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="./manifest.json" />
  <title>小祕</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #161923; color: #fff; }
    #bg { position: fixed; inset: 0; background-size: cover; background-position: center; z-index: 1; }
    #char { position: fixed; bottom: 68px; left: 50%; transform: translateX(-50%); height: 84vh; max-width: 94vw; object-fit: contain; z-index: 2; pointer-events: none; }
    #top { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; z-index: 10; }
    .btn { background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
    #hist { position: fixed; top: 52px; right: 14px; width: 300px; max-height: 45vh; overflow-y: auto; background: rgba(16,18,26,0.94); border: 1px solid #444; border-radius: 14px; padding: 12px; display: none; z-index: 20; font-size: 13px; }
    #bubble { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 460px; background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,0.25); padding: 10px 16px; border-radius: 16px; text-align: center; font-size: 14px; z-index: 8; }
    #bar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 460px; height: 48px; background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.25); border-radius: 24px; display: flex; align-items: center; padding: 4px 8px; gap: 6px; z-index: 15; }
    #inp { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; display: none; }
    #hold { flex: 1; height: 38px; border-radius: 19px; border: none; background: rgba(255,255,255,0.2); color: #fff; font-weight: bold; cursor: pointer; user-select: none; -webkit-user-select: none; }
    #hold.on { background: #ff7eb3; color: #111; }
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .card { background: #1e2230; border-radius: 16px; padding: 20px; width: 100%; max-width: 380px; }
    .card input, .card select { width: 100%; margin: 6px 0 12px; padding: 8px; border-radius: 8px; border: 1px solid #555; background: #2a2f42; color: #fff; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <img id="char" src="" alt="character" />
  <div id="top">
    <span class="btn" id="stat">載入中</span>
    <div>
      <button class="btn" id="vBtn">🔊 甜美</button>
      <button class="btn" id="mBtn">換裝</button>
      <button class="btn" id="hBtn">紀錄</button>
      <button class="btn" id="sBtn">⚙️</button>
    </div>
  </div>
  <div id="hist"></div>
  <div id="bubble">早安！點右上角 ⚙️ 填入免費 Gemini 金鑰就能聊天囉。</div>
  <div id="bar">
    <button class="btn" id="tBtn">⌨️</button>
    <input id="inp" placeholder="輸入訊息..." />
    <button id="hold">按住 說話</button>
    <button class="btn" id="send" style="display:none;background:#ff7eb3;color:#111;">傳送</button>
  </div>
  <div id="modal">
    <div class="card">
      <h3 style="margin-bottom:10px;">小祕設定</h3>
      <label>Gemini 免費金鑰</label><input type="password" id="kInp" />
      <label>聲線風格</label><select id="vSel">
        <option value="sweet">甜美鄰家女聲</option>
        <option value="gentle">溫柔知性秘書</option>
        <option value="mute">靜音</option>
      </select>
      <button class="btn" id="testV" style="width:100%;margin-bottom:10px;background:#3b82f6;">🔊 試聽聲音</button>
      <label>上班立繪網址</label><input id="wImg" />
      <label>居家立繪網址</label><input id="hImg" />
      <button class="btn" id="save" style="width:100%;background:#ff7eb3;color:#111;font-weight:bold;">儲存</button>
    </div>
  </div>

  <script>
    var defaultCfg = { key: "", v: "sweet", w: "", h: "" };
    var savedCfg = JSON.parse(localStorage.getItem("xm_c") || "{}");
    var cfg = Object.assign({}, defaultCfg, savedCfg);

    var logs = JSON.parse(localStorage.getItem("xm_l") || "[]");
    var mode = "work", voiceMode = true;
    var bbl = document.getElementById("bubble");

    function setMode(m) {
      mode = m;
      document.getElementById("stat").textContent = m === "work" ? "上班 · 高馬尾" : "居家 · 長髮";
      const imgUrl = m === "work" ? cfg.w : cfg.h;
      document.getElementById("char").src = imgUrl || "";
    }

    function speak(t, st) {
      window.speechSynthesis.cancel();
      var s = st || cfg.v;
      if (s === "mute") return;
      var u = new SpeechSynthesisUtterance(t);
      u.lang = "zh-TW";
      u.pitch = s === "sweet" ? 1.18 : 1.02;
      u.rate = s === "sweet" ? 1.05 : 0.96;
      window.speechSynthesis.speak(u);
    }

    function push(who, txt, spk) {
      logs.push({ who: who, txt: txt });
      if (logs.length > 40) logs.shift();
      localStorage.setItem("xm_l", JSON.stringify(logs));
      bbl.textContent = txt;
      document.getElementById("hist").innerHTML = logs.map(x =>
        `<div style='margin-bottom:6px;'><b>${x.who}：</b>${x.txt}</div>`
      ).join("");
      if (spk) speak(txt);
    }

    async function ask(q) {
      push("你", q, false);
      if (!cfg.key) {
        return push("小祕", "請先點右上角 ⚙️ 填入免費 Gemini 金鑰喔！", true);
      }
      bbl.textContent = "小祕思考中...";
      const systemPrompt = "你是可愛貼心的專屬AI秘書「小祕」，現在是"
        + (mode === "work" ? "上班高馬尾時間" : "居家長髮時間")
        + "。請用繁體中文簡短回覆使用者問題。";
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cfg.key}`;
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: systemPrompt + "\n使用者：" + q }] }]
          })
        });
        const data = await res.json();
        if (data.error) {
          return push("小祕", "API錯誤：" + data.error.message, false);
        }
        const candidate = data.candidates?.[0];
        if (!candidate || !candidate.content) {
          return push("小祕", "模型沒有回覆內容", false);
        }
        const replyText = candidate.content.parts[0].text.trim();
        push("小祕", replyText, true);
      } catch (err) {
        push("小祕", "連線異常：" + err.message, false);
      }
    }

    document.getElementById("vBtn").onclick = function () {
      var opts = ["sweet", "gentle", "mute"];
      cfg.v = opts[(opts.indexOf(cfg.v) + 1) % 3];
      localStorage.setItem("xm_c", JSON.stringify(cfg));
      this.textContent = cfg.v === "sweet" ? "🔊 甜美"
        : cfg.v === "gentle" ? "🔈 溫柔" : "🔇 靜音";
      if (cfg.v !== "mute") speak("早安！我是小祕，這樣講話好聽嗎？");
    };

    document.getElementById("mBtn").onclick = function () {
      setMode(mode === "work" ? "home" : "work");
    };

    document.getElementById("hBtn").onclick = function () {
      const histDom = document.getElementById("hist");
      histDom.style.display = histDom.style.display === "block" ? "none" : "block";
    };

    document.getElementById("sBtn").onclick = function () {
      document.getElementById("kInp").value = cfg.key;
      document.getElementById("vSel").value = cfg.v;
      document.getElementById("wImg").value = cfg.w;
      document.getElementById("hImg").value = cfg.h;
      document.getElementById("modal").style.display = "flex";
    };

    document.getElementById("testV").onclick = function () {
      speak("早安！今天的行程我都幫你整理好了喔。", document.getElementById("vSel").value);
    };

    document.getElementById("save").onclick = function () {
      cfg.key = document.getElementById("kInp").value.trim();
      cfg.v = document.getElementById("vSel").value;
      cfg.w = document.getElementById("wImg").value.trim();
      cfg.h = document.getElementById("hImg").value.trim();
      localStorage.setItem("xm_c", JSON.stringify(cfg));
      setMode(mode);
      document.getElementById("modal").style.display = "none";
      push("小祕", "設定已儲存！", true);
    };

    document.getElementById("tBtn").onclick = function () {
      voiceMode = !voiceMode;
      this.textContent = voiceMode ? "⌨️" : "🎙️";
      document.getElementById("hold").style.display = voiceMode ? "block" : "none";
      document.getElementById("inp").style.display = voiceMode ? "none" : "block";
      document.getElementById("send").style.display = voiceMode ? "none" : "block";
    };

    document.getElementById("send").onclick = function () {
      const val = document.getElementById("inp").value.trim();
      if (val) {
        document.getElementById("inp").value = "";
        ask(val);
      }
    };

    document.getElementById("inp").onkeydown = function (e) {
      if (e.key === "Enter") document.getElementById("send").click();
    };

    // 語音辨識
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = SR ? new SR() : null;
    let buf = "", holding = false;

    if (rec) {
      rec.lang = "zh-TW";
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = function (e) {
        let txt = "";
        for (let i = 0; i < e.results.length; i++) {
          txt += e.results.item(i).item(0).transcript;
        }
        buf = txt;
        if (holding) bbl.textContent = "正在聆聽：" + (buf || "...");
      };
      rec.onerror = function (e) {
        bbl.textContent = "麥克風提示：" + e.error;
      };
    }

    const hBtn = document.getElementById("hold");

    function startR() {
      if (!rec) {
        bbl.textContent = "此瀏覽器不支援語音，請點左下角 ⌨️ 打字。";
        return;
      }
      if (holding) return;
      holding = true;
      buf = "";
      hBtn.classList.add("on");
      hBtn.textContent = "鬆開 傳送";
      bbl.textContent = "正在聆聽，請說話...";
      try { rec.start(); } catch (e) { }
    }

    function stopR() {
      if (!holding) return;
      holding = false;
      hBtn.classList.remove("on");
      hBtn.textContent = "按住 說話";
      if (rec) {
        try { rec.stop(); } catch (e) { }
      }
      setTimeout(() => {
        if (buf.trim()) {
          ask(buf.trim());
        }
      }, 120);
    }

    hBtn.addEventListener("mousedown", startR);
    hBtn.addEventListener("mouseup", stopR);
    hBtn.addEventListener("mouseleave", stopR);
    hBtn.addEventListener("touchstart", (ev) => { ev.preventDefault(); startR(); });
    hBtn.addEventListener("touchend", (ev) => { ev.preventDefault(); stopR(); });

    // 初始化
    setMode(mode);
  </script>
</body>
</html>
