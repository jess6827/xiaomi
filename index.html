<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小祕</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#111;color:#fff;height:100svh;display:flex;flex-direction:column;overflow:hidden}
.live2d-area{width:100%;height:32vh;background:#252525;position:relative}
#live2d-canvas{width:100%;height:100%;display:block}
#chatBox{flex:1;padding:12px;overflow-y:auto;background:#141414}
.msg{margin:6px 0;line-height:1.5}
.msg.user{color:#8cf}
.msg.ai{color:#fdc}
.input-bar{display:flex;gap:6px;padding:10px;padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));background:#222}
#userInput{flex:1;padding:10px;border:none;border-radius:8px;font-size:16px}
button{padding:10px 14px;border:none;border-radius:8px;background:#4885ed;color:#fff;font-size:15px}
.btn-set{background:#444;margin:4px}
.set-panel{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;padding:20px;padding-bottom: env(safe-area-inset-bottom,0px)}
.set-card{background:#222;padding:20px;border-radius:12px;width:100%;max-width:400px}
.set-card h3{margin-bottom:12px}
.set-card input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none}
.btn-close{background:#b33}
</style>
</head>
<body>
<div class="live2d-area">
  <canvas id="live2d-canvas"></canvas>
</div>
<div id="chatBox"></div>
<div class="input-bar">
  <input type="text" id="userInput" placeholder="輸入訊息...">
  <button onclick="sendMsg()">送出</button>
  <button class="btn-set" onclick="openSetting()">設定</button>
</div>
<div class="set-panel" id="setPanel">
  <div class="set-card">
    <h3>設定</h3>
    <label>Gemini API Key</label>
    <input type="text" id="apiKeyInput" placeholder="貼上完整API Key">
    <div style="display:flex;gap:8px;margin-top:10px">
      <button onclick="saveKey()">儲存</button>
      <button class="btn-close" onclick="closeSetting()">關閉</button>
    </div>
  </div>
</div>
<script>
let history = [];
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const setPanel = document.getElementById('setPanel');
const apiKeyInput = document.getElementById('apiKeyInput');
let apiKey = localStorage.getItem('gemini_key') || "";
apiKeyInput.value = apiKey;

function openSetting(){ setPanel.style.display = 'flex'; }
function closeSetting(){ setPanel.style.display = 'none'; }
function saveKey(){
  apiKey = apiKeyInput.value.trim();
  localStorage.setItem('gemini_key', apiKey);
  alert("已儲存！");
  closeSetting();
}
function renderMsg(isUser, text){
  const div = document.createElement('div');
  div.className = isUser ? "msg user" : "msg ai";
  div.innerHTML = isUser ? `<b>你：</b>${text}` : `<b>小祕：</b>${text}`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
function speak(txt){
  const utt = new SpeechSynthesisUtterance(txt);
  utt.lang = "zh-TW";
  speechSynthesis.speak(utt);
}
async function sendMsg(){
  const text = userInput.value.trim();
  if(!text) return;
  if(!apiKey){
    alert("請先去設定填入 Gemini API Key");
    return;
  }
  userInput.value = "";
  renderMsg(true, text);
  history.push({role:"user", parts:[{text:text}]});
  // 換成 gemini-2.0-flash
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
  try{
    const res = await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        contents: history,
        systemInstruction: {text:"你是小祕，語氣溫柔，使用自然繁體中文回覆。"}
      })
    })
    const data = await res.json();
    if(!data.candidates){
      renderMsg(false,"發生錯誤，金鑰有誤、配額用完，或是GitHub Pages跨域限制。");
      return;
    }
    const reply = data.candidates[0].content.parts[0].text;
    history.push({role:"model", parts:[{text:reply}]});
    renderMsg(false, reply);
    speak(reply);
  }catch(err){
    console.error(err);
    renderMsg(false,"連線錯誤，GitHub Pages網頁版容易遇到CORS跨域攔截，打包APK就不會有這個問題。");
  }
}
userInput.addEventListener('keydown',e=>{
  if(e.key === 'Enter') sendMsg();
})
</script>
</body>
</html>
