<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小祕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
html,body{height:100%;overflow:hidden;}
.wrap{width:100%;height:100%;position:relative;display:flex;flex-direction:column;}

.character-area{
    flex:4;
    position:relative;
    z-index:1;
}
.character-area .placeholder{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    color:#cfd3dc;font-size:16px;
}

.chat-container{
    flex:2;
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    padding:0 5%;
    gap:12px;
}

/* 歷史紀錄面板：灰白半透 + 陰影 */
.chat-panel{
    flex:1;
    background: rgba(245, 247, 250, 0.72);
    border-radius:22px;
    border: 1px solid rgba(220, 224, 230, 0.7);
    display:flex;
    flex-direction:column;
    box-shadow: 0 10px 30px rgba(20, 30, 60, 0.12);
    backdrop-filter: blur(10px);
}
.panel-title{
    padding:14px;
    text-align:center;
    color:#6f7887;
    font-size:15px;
}
.chat-content{flex:1;padding:12px;overflow-y:auto;}

.msg{margin:8px 0;max-width:72%;}
.msg.me{margin-left:auto;}
.msg.me .bubble{
    background:#36c870;color:#fff;
    border-radius:16px 4px 16px 16px;
    padding:10px 14px;font-size:16px;
}
.msg.ai{margin-right:auto;}
.msg.ai .bubble{
    background:#ffffff;color:#1f2937;
    border-radius:4px 16px 16px 16px;
    padding:10px 14px;font-size:16px;
    box-shadow: 0 2px 8px rgba(20, 30, 60, 0.06);
}
.loading{display:flex;gap:6px;padding:10px 14px;}
.dot{width:10px;height:10px;border-radius:50%;background:#5ec4ff;animation:dot 1.2s infinite;}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,40%{opacity:0.3}20%{opacity:1}}

/* 底部輸入列：豆包同款、全圓角、白色、陰影 */
.bottom-bar{
    position:relative;
    min-height:64px;
    max-height:82px;
    background:#ffffff;
    border:1px solid #eef1f5;
    border-radius:18px;
    box-shadow: 0 10px 24px rgba(20, 30, 60, 0.18);
    display:flex;align-items:center;gap:12px;padding:0 16px;
}
.bar-btn{
    width:42px;height:42px;
    border-radius:50%;
    border:1px solid #e5e7eb;color:#1f2937;
    display:grid;place-items:center;
    font-size:26px;background:#fff;cursor:pointer;
}
.voice-btn{
    flex:1;height:44px;border-radius:14px;
    background:#f5f7fa;color:#1f2937;
    border:1px solid #eef1f5;font-size:16px;cursor:pointer;
}
.text-input-wrap{
    flex:1;
    display:none;
}
.text-input{
    width:100%;height:44px;border-radius:14px;padding:0 12px;
    border:1px solid #eef1f5;font-size:16px;outline:none;
}

.more-menu{
    position:absolute;left:0;right:0;top:100%;
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:16px;display:none;
    z-index:3;
    box-shadow: 0 14px 28px rgba(20, 30, 60, 0.18);
}
.more-menu.show{display:block;}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.menu-item{text-align:center;color:#374151;font-size:14px;padding:8px 0;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
    <div class="character-area">
        <div class="placeholder">【小祕半身動畫區】</div>
    </div>
    <div class="chat-container">
        <div class="chat-panel">
            <div class="panel-title">▼ 歷史紀錄</div>
            <div class="chat-content" id="chatBox">
            </div>
        </div>
        <div class="bottom-bar">
            <button class="bar-btn" id="keyBtn">⌨</button>
            <div class="text-input-wrap" id="textWrap">
                <input class="text-input" id="textInput" placeholder="輸入訊息">
            </div>
            <button class="voice-btn" id="voiceBtn">按住 說話</button>
            <button class="bar-btn" id="emojiBtn">☺</button>
            <button class="bar-btn" id="plusBtn">+</button>
            <div class="more-menu" id="menu">
                <div class="menu-grid">
                    <div class="menu-item">照片庫</div>
                    <div class="menu-item">拍攝</div>
                    <div class="menu-item">皮膚</div>
                    <div class="menu-item">設定</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
// ========= 這裡填你的 Gemini API Key =========
const GEMINI_API_KEY = "填入你的key";
const MODEL_NAME = "gemini-1.5-flash";
// ==============================================

const chatBox = document.getElementById("chatBox");
const voiceBtn = document.getElementById("voiceBtn");
const keyBtn = document.getElementById("keyBtn");
const textWrap = document.getElementById("textWrap");
const textInput = document.getElementById("textInput");
const plusBtn = document.getElementById("plusBtn");
const menu = document.getElementById("menu");
const emojiBtn = document.getElementById("emojiBtn");

let speechRec;
let isTextMode = false;
let chatHistory = [];

// 切換文字 / 語音模式
keyBtn.onclick = () => {
    isTextMode = !isTextMode;
    if(isTextMode){
        textWrap.style.display = "block";
        voiceBtn.style.display = "none";
        textInput.focus();
    }else{
        textWrap.style.display = "none";
        voiceBtn.style.display = "block";
    }
}

// 文字輸入送出
textInput.onkeydown = async (e)=>{
    if(e.key === "Enter" && textInput.value.trim()){
        await sendMsg(textInput.value.trim());
        textInput.value = "";
    }
}

// 語音辨識
if("webkitSpeechRecognition" in window){
    speechRec = new webkitSpeechRecognition();
    speechRec.lang = "zh-TW";
    speechRec.continuous = false;
    speechRec.interimResults = false;

    speechRec.onresult = async (e)=>{
        const text = e.results[0][0].transcript;
        await sendMsg(text);
    }
    speechRec.onerror = (err)=>{
        alert("語音辨識失敗："+err.error);
        voiceBtn.innerText = "按住 說話";
    }
    speechRec.onend = ()=>{
        voiceBtn.innerText = "按住 說話";
    }
}

voiceBtn.ontouchstart = voiceBtn.onmousedown = ()=>{
    if(!speechRec){
        alert("瀏覽器不支援語音辨識");
        return;
    }
    voiceBtn.innerText = "放開結束錄音";
    speechRec.start();
}
voiceBtn.ontouchend = voiceBtn.onmouseup = ()=>{
    speechRec?.stop();
}

// + 選單
plusBtn.onclick = (e)=>{
    e.stopPropagation();
    menu.classList.toggle('show');
}
document.body.addEventListener('click',e=>{
    if(!plusBtn.contains(e.target) && !menu.contains(e.target)) menu.classList.remove('show');
})
emojiBtn.onclick = ()=>alert('表情面板（待開發）');

// 新增訊息到畫面
function addMsg(text, isMe){
    const div = document.createElement('div');
    div.className = "msg " + (isMe ? "me" : "ai");
    div.innerHTML = `<div class="bubble">${text}</div>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

// 新增loading
function addLoading(){
    const div = document.createElement('div');
    div.className = "msg ai loading-wrap";
    div.innerHTML = `<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

// 送出訊息給Gemini
async function sendMsg(userText){
    addMsg(userText, true);
    const loadingEl = addLoading();
    chatHistory.push({role:"user", parts:[{text:userText}]});
    try{
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${GEMINI_API_KEY}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                contents: chatHistory
            })
        })
        const data = await res.json();
        loadingEl.remove();
        if(data.candidates?.[0]?.content?.parts?.[0]?.text){
            const reply = data.candidates[0].content.parts[0].text;
            addMsg(reply, false);
            chatHistory.push({role:"model", parts:[{text:reply}]});
        }else{
            addMsg("沒有回覆，或是key錯誤", false);
        }
    }catch(err){
        loadingEl.remove();
        addMsg("連線錯誤："+err.message, false);
    }
}
</script>
</body>
</html>
