<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小祕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
html,body{height:100%;overflow:hidden;}
.wrap{width:100%;height:100%;position:relative;background:#000;}
/* 角色背景層（之後替換成你的風景+小祕圖） */
.bg-layer{position:absolute;inset:0;background:url('') center/cover no-repeat;z-index:1;}
/* 對話面板 4:2 分配 */
.chat-panel{
    position:absolute;left:5%;right:5%;top:42%;bottom:16%;
    background:rgba(20,22,30,0.55);
    border-radius:22px;border:1px solid rgba(255,255,255,0.18);
    z-index:2;
    display:flex;flex-direction:column;
}
.panel-title{padding:14px;text-align:center;color:#fff;font-size:18px;}
/* 對話區 4份，面板下方留白2份 */
.chat-content{flex:4;padding:12px;overflow-y:auto;}
.chat-space{flex:2;}
.msg{margin:8px 0;max-width:72%;}
.msg.me{margin-left:auto;}
.msg.me .bubble{background:#36c870;color:#fff;border-radius:16px 4px 16px 16px;padding:10px 14px;font-size:16px;}
.msg.ai{margin-right:auto;}
.msg.ai .bubble{background:rgba(255,255,255,0.22);color:#fff;border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:16px;}
.loading{display:flex;gap:6px;padding:10px 14px;}
.dot{width:10px;height:10px;border-radius:50%;background:#39e2cc;animation:dot 1.2s infinite;}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,40%{opacity:0.3}20%{opacity:1}}
/* 底部輸入列 */
.bottom-bar{
    position:absolute;left:0;right:0;bottom:0;
    height:14%;min-height:70px;
    background:rgba(15,16,22,0.6);
    display:flex;align-items:center;gap:10px;padding:0 16px;
    z-index:2;
}
.bar-btn{width:44px;height:44px;border-radius:50%;border:1px solid #fff;color:#fff;display:grid;place-items:center;font-size:20px;background:transparent;}
.voice-btn{flex:1;height:44px;border-radius:12px;background:rgba(255,255,255,0.12);color:#fff;border:none;font-size:17px;}
/* +號選單：從底部bar下方彈出來，不往上跑 */
.more-menu{
    position:absolute;left:0;right:0;bottom:100%;
    background:rgba(18,20,28,0.92);
    border-radius:16px 16px 0 0;
    padding:16px;display:none;
    z-index:3;
}
.more-menu.show{display:block;}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.menu-item{text-align:center;color:#fff;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
    <div class="bg-layer"></div>
    <div class="chat-panel">
        <div class="panel-title">▼ 歷史紀錄</div>
        <div class="chat-content">
            <div class="msg me">
                <div class="bubble">幫我查一下彰化的天氣</div>
            </div>
            <div class="msg ai">
                <div class="loading">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
            </div>
            <div class="msg ai">
                <div class="bubble">好的，小秘書正在為您查詢...</div>
            </div>
        </div>
        <div class="chat-space"></div>
    </div>
    <div class="bottom-bar">
        <button class="bar-btn">⌨</button>
        <button class="voice-btn">按住 說話</button>
        <button class="bar-btn">☺</button>
        <button class="bar-btn" id="plusBtn">+</button>
        <div class="more-menu" id="menu">
            <div class="menu-grid">
                <div class="menu-item">照片庫</div>
                <div class="menu-item">拍攝</div>
                <div class="menu-item">皮膚</div>
                <div class="menu-item">設定</div>
            </div>
        </div>
    </div>
</div>
<script>
const plusBtn = document.getElementById('plusBtn');
const menu = document.getElementById('menu');
plusBtn.onclick = ()=>menu.classList.toggle('show');
document.body.addEventListener('click',e=>{
    if(!plusBtn.contains(e.target) && !menu.contains(e.target)) menu.classList.remove('show');
})
</script>
</body>
</html>
