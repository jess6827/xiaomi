<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小祕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html{color-scheme: light;}
body{
  background:#f3f4f6;
  padding:16px;
  padding-bottom:140px;
}
.anim-area{
  text-align:center;
  color:#999;
  margin-bottom:12px;
  font-size:14px;
}
.chat-wrap{
  background:#ffffff;
  border-radius:22px;
  padding:18px;
  box-shadow:0 2px 10px #00000012;
  margin-bottom:12px;
}
.chat-header{
  text-align:center;
  font-size:16px;
  color:#666;
  margin-bottom:16px;
  cursor:pointer;
}
.chat-box{
  display:flex;
  flex-direction:column;
  gap:12px;
  max-height:360px;
  overflow-y:auto;
}
.msg{
  max-width:78%;
  padding:12px 14px;
  border-radius:18px;
  line-height:1.5;
  font-size:15px;
}
.msg.user{
  background:#22c55e;
  color:#fff;
  align-self:flex-end;
  border-bottom-right-radius:4px;
}
.msg.ai{
  background:#f1f1f1;
  color:#222;
  align-self:flex-start;
  border-bottom-left-radius:4px;
}
.ctrl-bar{
  display:flex;
  justify-content:space-around;
  background:#fff;
  border-radius:22px;
  padding:16px 8px;
  margin-bottom:12px;
  box-shadow:0 2px 10px #00000012;
}
.ctrl-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:#444;
  cursor:pointer;
}
.ctrl-icon{
  width:48px;
  height:48px;
  background:#f3f4f6;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.input-wrap{
  position:fixed;
  left:16px;
  right:16px;
  bottom:16px;
  background:#fff;
  border-radius:24px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:0 2px 12px #00000018;
}
#voiceHoldBtn{
  flex:1;
  padding:10px 0;
  border-radius:12px;
  border:1px solid #eee;
  background:#f7f7f7;
  text-align:center;
  font-size:16px;
  color:#333;
  user-select:none;
}
.icon-btn{
  width:36px;
  height:36px;
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:24px;
}
.modal-box{
  width:100%;
  background:#fff;
  border-radius:24px;
  padding:28px;
}
.modal-title{
  font-size:20px;
  margin-bottom:20px;
}
.modal-input{
  width:100%;
  border:none;
  border-bottom:1px solid #ccc;
  font-size:16px;
  padding:8px 0;
  outline:none;
  margin-bottom:24px;
}
.modal-row{
  display:flex;
  justify-content:flex-end;
  gap:24px;
}
.modal-btn{
  font-size:17px;
  border:none;
  background:transparent;
  color:#2563eb;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="anim-area">【小祕半身動畫區】</div>

<div class="chat-wrap">
  <div class="chat-header" id="historyToggle">▼ 歷史紀錄</div>
  <div class="chat-box" id="chat"></div>
</div>

<div class="ctrl-bar">
  <div class="ctrl-item" onclick="openCam()">
    <div class="ctrl-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </div>
    <span>相機</span>
  </div>
  <div class="ctrl-item" onclick="openGallery()">
    <div class="ctrl-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </div>
    <span>圖庫</span>
  </div>
  <div class="ctrl-item" onclick="openSkin()">
    <div class="ctrl-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5">
        <path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"></path>
      </svg>
    </div>
    <span>皮膚</span>
  </div>
  <div class="ctrl-item" onclick="openSetting()">
    <div class="ctrl-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>
    <span>設定</span>
  </div>
</div>

<div class="input-wrap">
  <button class="icon-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#333">
      <rect x="2" y="4" width="20" height="16" rx="2"></rect>
    </svg>
  </button>
  <div id="voiceHoldBtn">按住 說話</div>
  <button class="icon-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
      <line x1="9" y1="9" x2="9.01" y2="9"></line>
      <line x1="15" y1="9" x2="15.01" y2="9"></line>
    </svg>
  </button>
  <button class="icon-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>
</div>

<div class="modal-mask" id="keyModal">
  <div class="modal-box">
    <div class="modal-title">請輸入 Gemini API Key：</div>
    <input class="modal-input" id="keyInput">
    <div class="modal-row">
      <button class="modal-btn" id="modalCancel">取消</button>
      <button class="modal-btn" id="modalOk">確定</button>
    </div>
  </div>
</div>

<script>
const chatBox = document.getElementById('chat');
const voiceHoldBtn = document.getElementById('voiceHoldBtn');
const historyToggle = document.getElementById('historyToggle');
const keyModal = document.getElementById('keyModal');
const keyInput = document.getElementById('keyInput');
const modalCancel = document.getElementById('modalCancel');
const modalOk = document.getElementById('modalOk');
let apiKey = localStorage.getItem('geminiKey') || '';
let recognition = null;

historyToggle.onclick = ()=>{
  if(historyToggle.innerText.startsWith('▲')){
    historyToggle.innerText = '▼ 歷史紀錄';
    chatBox.style.display = 'none';
  }else{
    historyToggle.innerText = '▲ 歷史紀錄';
    chatBox.style.display = 'flex';
  }
}

function addMsg(text, type){
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendText(text){
  if(!apiKey){
    addMsg('請先點設定填入 API Key 喔！','ai');
    return;
  }
  addMsg(text, 'user');
  addMsg('小祕正在思考...','ai');
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents: [{parts:[{text:text}]}]})
    })
    const data = await res.json();
    chatBox.lastChild.remove();
    if(data.candidates?.[0]?.content?.parts?.[0]?.text){
      addMsg(data.candidates[0].content.parts[0].text, 'ai');
    }else{
      addMsg('回應失敗，請檢查金鑰','ai');
    }
  }catch(e){
    chatBox.lastChild.remove();
    addMsg('連線錯誤','ai');
  }
}

// 按住說話
voiceHoldBtn.onmousedown = voiceHoldBtn.ontouchstart = async ()=>{
  voiceHoldBtn.innerText = '放開 結束';
  if(!window.SpeechRecognition && !window.webkitSpeechRecognition){
    alert('不支援語音辨識');
    voiceHoldBtn.innerText = '按住 說話';
    return;
  }
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new Rec();
  recognition.lang = 'zh-TW';
  recognition.start();
  recognition.onresult = (e)=>{
    const txt = e.results[0][0].transcript;
    sendText(txt);
  }
  recognition.onerror = ()=>{
    voiceHoldBtn.innerText = '按住 說話';
  }
}
voiceHoldBtn.onmouseup = voiceHoldBtn.ontouchend = ()=>{
  voiceHoldBtn.innerText = '按住 說話';
  if(recognition) recognition.stop();
}

modalOk.onclick = ()=>{
  const val = keyInput.value.trim();
  if(val){
    apiKey = val;
    localStorage.setItem('geminiKey', apiKey);
  }
  keyModal.style.display = 'none';
}
modalCancel.onclick = ()=> keyModal.style.display = 'none';

function openCam(){alert('相機')}
function openGallery(){alert('圖庫')}
function openSkin(){alert('換膚')}
function openSetting(){
  keyInput.value = apiKey;
  keyModal.style.display = 'flex';
}
</script>
</body>
</html>
