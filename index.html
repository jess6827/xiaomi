<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小祕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111;color:#fff;height:100vh;display:flex;flex-direction:column}
header{padding:12px;text-align:center;font-size:18px;border-bottom:1px solid #333}
.chat-area{flex:1;padding:12px;overflow-y:auto}
.input-bar{display:flex;gap:8px;padding:12px;border-top:1px solid #333}
input{flex:1;padding:10px;border-radius:99px;border:none;outline:none}
button{padding:10px 16px;border-radius:99px;border:none;background:#4488ff;color:white}
</style>
</head>
<body>
<header>小祕</header>
<div class="chat-area">
  <div>小祕：嗨～</div>
</div>
<div class="input-bar">
  <input placeholder="輸入文字...">
  <button>送出</button>
</div>
</body>
</html>
