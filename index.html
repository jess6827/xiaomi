<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小祕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
html,body{height:100%;overflow:hidden}
body{background:#f2f3f5;color:#1f2630}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}

/* ===== 上 4 份：小祕半身區（背景風景圖之後放這層） ===== */
.character-area{flex:4;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.character-area .placeholder{color:#b9bec8;font-size:15px;letter-spacing:1px}
#charImg{height:100%;width:auto;max-height:100%;max-width:88vw;object-fit:contain}
#charImg.broken{display:none}

/* ===== 下 2 份：對話面板 + 輸入列整套 ===== */
.chat-container{flex:2;display:flex;flex-direction:column;gap:10px;padding:0 14px 12px}

/* 對話面板：半透明灰白色，輕色階 */
.chat-panel{flex:1;background:rgba(255,255,255,0.62);border:1px solid rgba(255,255,255,0.7);border-radius:22px;backdrop-filter:blur(10px);display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(30,40,70,0.08);overflow:hidden}
.panel-title{padding:13px 16px;text-align:center;font-size:15px;color:#6f7887;cursor:pointer;user-select:none}
.chat-content{flex:1;padding:4px 14px 12px;overflow-y:auto}

.msg{margin:8px 0;max-width:78%}
.msg.me{margin-left:auto}
.msg.me .bubble{background:#34c759;color:#fff;border-radius:16px 4px 16px 16px;padding:10px 14px;font-size:15px;line-height:1.4}
.msg.ai{margin-right:auto}
.msg.ai .bubble{background:rgba(255,255,255,0.78);color:#222b38;border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:15px;line-height:1.4}
.loading{display:flex;gap:6px;padding:10px 14px}
.dot{width:10px;height:10px;border-radius:50%;background:#5ec4ff;animation:dot 1.2s infinite}
.dot:nth-child(2){animation-delay:.18s}
.dot:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,40%{opacity:.3}20%{opacity:1}}

/* ===== 底部輸入列：豆包風格，白底圓角浮起，黑色細圖標 ===== */
.bottom-bar{position:relative;min-height:60px;max-height:76px;background:#ffffff;border:1px solid #eceef1;border-radius:20px;display:flex;align-items:center;gap:10px;padding:6px 10px;box-shadow:0 4px 14px rgba(30,40,70,0.10)}
.bar-btn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:#1f2630;display:grid;place-items:center;cursor:pointer;flex:0 0 40px}
.bar-btn svg{width:26px;height:26px;fill:#1f2630}
.voice-btn{flex:1;height:42px;border-radius:14px;background:#f2f3f5;color:#1f2630;border:1px solid #eceef1;font-size:16px;cursor:pointer}

/* 文字模式：輸入框內嵌發送鍵 */
.text-mode-box{flex:1;display:none;align-items:center;gap:8px;background:#f2f3f5;border:1px solid #eceef1;border-radius:14px;padding:4px 4px 4px 14px}
.text-mode-box.active{display:flex}
.text-mode-box input{flex:1;background:transparent;border:none;outline:none;color:#1f2630;font-size:16px;height:38px;min-width:0}
.text-mode-box .inner-send{width:38px;height:38px;border-radius:50%;border:none;background:#34c759;display:grid;place-items:center;flex:0 0 38px;cursor:pointer}
.text-mode-box .inner-send svg{width:19px;height:19px;fill:#fff}

/* + 選單：貼輸入列上緣向上浮起，不被底邊切掉 */
.more-menu{position:absolute;left:0;right:0;bottom:100%;margin-bottom:8px;background:#ffffff;border:1px solid #eceef1;border-radius:20px;padding:18px 12px;display:none;z-index:5;box-shadow:0 8px 24px rgba(30,40,70,0.14)}
.more-menu.show{display:block}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.menu-item{display:flex;flex-direction:column;align-items:center;gap:8px;color:#1f2630;font-size:13px;cursor:pointer}
.menu-item .icon{width:52px;height:52px;border-radius:16px;background:#f2f3f5;border:1px solid #eceef1;display:grid;place-items:center}
.menu-item .icon img{width:30px;height:30px;object-fit:contain}
.menu-item .icon svg{width:30px;height:30px;fill:#1f2630}

/* 表情面板 */
.emoji-panel{position:absolute;left:0;right:0;bottom:100%;margin-bottom:8px;background:#ffffff;border:1px solid #eceef1;border-radius:20px;padding:16px;display:none;z-index:5}
.emoji-panel.show{display:block}
.emoji-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.emoji{font-size:26px;padding:6px;cursor:pointer}

/* ===== 設定彈窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal-mask.active{display:flex}
.modal-card{width:100%;max-width:520px;background:#ffffff;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
.modal-title{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:600;margin-bottom:16px}
.modal-close{cursor:pointer;color:#6f7887;font-size:22px;background:none;border:none}
.set-group{margin-bottom:14px}
.set-group label{display:block;font-size:13px;color:#6f7887;margin-bottom:6px}
.set-group label.check{display:flex;align-items:center;gap:10px;font-size:15px;color:#1f2630;margin-bottom:0}
.set-group label.check input{width:20px;height:20px;flex:0 0 20px;margin:0}
.set-group input,.set-group select{width:100%;height:44px;border-radius:12px;border:1px solid #eceef1;background:#f7f8fa;color:#1f2630;padding:0 12px;font-size:15px;outline:none}
.set-btn{width:100%;height:44px;border-radius:12px;border:none;background:#34c759;color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:6px}
.set-btn.ghost{background:#f2f3f5;color:#1f2630;border:1px solid #eceef1;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 上 4：小祕半身區 -->
  <div class="character-area">
    <img id="charImg" src="assets/sticker-idle.png" alt="小祕" />
    <div class="placeholder" id="charPlaceholder">【小祕半身動畫區】</div>
  </div>

  <!-- 下 2：對話整套 -->
  <div class="chat-container">
    <div class="chat-panel">
      <div class="panel-title" id="panelTitle">▼ 歷史紀錄</div>
      <div class="chat-content" id="msgBox">
        <div class="msg me"><div class="bubble">幫我查一下彰化的天氣</div></div>
        <div class="msg ai"><div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
        <div class="msg ai"><div class="bubble">好的，小祕正在為您查詢…</div></div>
      </div>
    </div>

    <!-- 底部輸入列 -->
    <div class="bottom-bar">
      <button class="bar-btn" id="keyBtn" title="鍵盤">
        <svg viewBox="0 0 24 24"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm2 3.5h2v2H6v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zM6 12.5h2v2H6v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zM6 16.5h12v2H6v-2z"/></svg>
      </button>

      <button class="voice-btn" id="voiceBtn">按住 說話</button>

      <div class="text-mode-box" id="textBox">
        <input type="text" id="textInput" placeholder="輸入訊息…" enterkeyhint="enter">
        <button class="inner-send" id="sendBtn" title="發送">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>

      <button class="bar-btn" id="emojiBtn" title="表情">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zM8.5 11a1.5 1.5 0 1 1 1.5-1.5A1.5 1.5 0 0 1 8.5 11zm7 0a1.5 1.5 0 1 1 1.5-1.5A1.5 1.5 0 0 1 15.5 11zm1.3 2.5c-1 1.6-2.5 2.5-4.8 2.5s-3.8-.9-4.8-2.5l1.4-1c.7 1 1.8 1.5 3.4 1.5s2.7-.5 3.4-1.5z"/></svg>
      </button>
      <button class="bar-btn" id="plusBtn" title="更多">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>

      <!-- + 選單：貼輸入列下方 -->
      <div class="more-menu" id="moreMenu">
        <div class="menu-grid">
          <div class="menu-item" id="takePhoto"><div class="icon"><img src="assets/icon_camera.png" alt="相機"></div><span>相機</span></div>
          <div class="menu-item" id="pickPhoto"><div class="icon"><img src="assets/icon_gallery.png" alt="圖庫"></div><span>圖庫</span></div>
          <div class="menu-item" id="skinBtn"><div class="icon"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5c0 1.6-.8 2.9-1.8 3.9-.7.7-1.2 1.4-1.2 2.6h-4c0-1.2-.5-1.9-1.2-2.6C7.8 9.9 7 8.6 7 7a5 5 0 0 1 5-5zm-5.5 11h11l1.6 7H4.9l1.6-7z"/></svg></div><span>皮膚</span></div>
          <div class="menu-item" id="openSettings"><div class="icon"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 4 4 4 4 0 0 0-4-4zm0 6.2A2.2 2.2 0 1 1 14.2 12 2.2 2.2 0 0 1 12 14.2zM20.6 13.5l1.6 1.2-2 3.4-1.9-.8a6.4 6.4 0 0 1-1.7 1l-.3 2.1h-4l-.3-2.1a6.4 6.4 0 0 1-1.7-1l-1.9.8-2-3.4 1.6-1.2a6.6 6.6 0 0 1 0-2L4.4 10.3l2-3.4 1.9.8a6.4 6.4 0 0 1 1.7-1l.3-2.1h4l.3 2.1a6.4 6.4 0 0 1 1.7 1l1.9-.8 2 3.4-1.6 1.2a6.6 6.6 0 0 1 0 2z"/></svg></div><span>設定</span></div>
        </div>
      </div>

      <!-- 表情面板 -->
      <div class="emoji-panel" id="emojiPanel">
        <div class="emoji-row">
          <span class="emoji" data-emo="😀">😀</span><span class="emoji" data-emo="🥰">🥰</span><span class="emoji" data-emo="😆">😆</span><span class="emoji" data-emo="🤔">🤔</span><span class="emoji" data-emo="👍">👍</span><span class="emoji" data-emo="❤️">❤️</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 設定彈窗 -->
<div class="modal-mask" id="settingsModal">
  <div class="modal-card">
    <div class="modal-title"><span>小祕專屬設定</span><button class="modal-close" id="closeSettings">✕</button></div>

    <div class="set-group">
      <label>對話模型</label>
      <select id="cfg-provider">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek</option>
      </select>
    </div>
    <div class="set-group">
      <label>Gemini API Key</label>
      <input type="password" id="cfg-gemini-key" placeholder="輸入 Gemini API Key">
    </div>
    <div class="set-group">
      <label>OpenAI API Key（選填）</label>
      <input type="password" id="cfg-openai-key" placeholder="sk-...">
    </div>
    <div class="set-group">
      <label>DeepSeek API Key（選填）</label>
      <input type="password" id="cfg-deepseek-key" placeholder="sk-...">
    </div>

    <div class="set-group">
      <label>TTS 語音模式</label>
      <select id="cfg-tts">
        <option value="openai-nova">擬真女聲（OpenAI Nova）</option>
        <option value="browser-free">免費內建語音</option>
        <option value="mute">靜音</option>
      </select>
    </div>
    <div class="set-group">
      <label>語音方言</label>
      <select id="cfg-voice">
        <option value="zh-TW">預設（繁中）</option>
        <option value="yue">廣東話</option>
        <option value="zh-CN">東北方言</option>
      </select>
    </div>

    <div class="set-group">
      <label>上班高馬尾立繪網址（選填）</label>
      <input type="text" id="cfg-img-work" placeholder="https://…/role_work.png">
    </div>
    <div class="set-group">
      <label>居家長髮立繪網址（選填）</label>
      <input type="text" id="cfg-img-home" placeholder="https://…/role_home.png">
    </div>
    <div class="set-group">
      <label>貼圖資料夾前綴（選填）</label>
      <input type="text" id="cfg-sticker-prefix" placeholder="assets/role-">
    </div>

    <div class="set-group">
      <label>帳號與授權</label>
      <button class="set-btn ghost" id="loginBtn" style="margin-top:0">Google 登入</button>
      <button class="set-btn ghost" id="driveBtn">雲端硬碟授權</button>
    </div>

    <div class="set-group">
      <label class="check"><input type="checkbox" id="cfg-wake"> 開啟喚醒詞</label>
    </div>
    <div class="set-group">
      <label class="check"><input type="checkbox" id="cfg-auto"> 劇情自動播放</label>
    </div>
    <div class="set-group">
      <label>劇情刷新時間（秒）</label>
      <input type="number" id="cfg-refresh" min="1" step="1" placeholder="30">
    </div>
    <div class="set-group">
      <label>動畫畫面參數（動態強度 0–1）</label>
      <input type="number" id="cfg-anim" min="0" max="1" step="0.1" placeholder="0.5">
    </div>
    <div class="set-group">
      <label class="check"><input type="checkbox" id="cfg-badge"> 表情狀態角標</label>
    </div>

    <button class="set-btn" id="saveSettings">儲存設定</button>
    <button class="set-btn ghost" id="clearHistory">清除對話紀錄</button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>

<script>
const charImg = document.getElementById('charImg');
const charPlaceholder = document.getElementById('charPlaceholder');
const voiceBtn = document.getElementById('voiceBtn');
const keyBtn = document.getElementById('keyBtn');
const emojiBtn = document.getElementById('emojiBtn');
const plusBtn = document.getElementById('plusBtn');
const moreMenu = document.getElementById('moreMenu');
const emojiPanel = document.getElementById('emojiPanel');
const textBox = document.getElementById('textBox');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const msgBox = document.getElementById('msgBox');
const settingsModal = document.getElementById('settingsModal');

/* ===== 設定：localStorage 讀存 ===== */
const DEFAULT_CONFIG = {
  provider: 'gemini', geminiKey: '', openaiKey: '', deepseekKey: '',
  tts: 'browser-free', voice: 'zh-TW',
  imgWork: '', imgHome: '', stickerPrefix: 'assets/role-',
  wake: false, auto: false, refresh: 30, anim: 0.5, badge: true
};
let appConfig = Object.assign({}, DEFAULT_CONFIG, JSON.parse(localStorage.getItem('xiaomi_cfg') || '{}'));
let chatHistory = JSON.parse(localStorage.getItem('xiaomi_history') || '[]');

function saveConfig(){ localStorage.setItem('xiaomi_cfg', JSON.stringify(appConfig)); }

/* 角色圖載入失敗就隱藏圖、保留占位文字，不補占位圖 */
charImg.onerror = () => { charImg.classList.add('broken'); charPlaceholder.style.display = 'block'; };
charImg.onload = () => { if (charImg.naturalWidth) { charImg.classList.remove('broken'); charPlaceholder.style.display = 'none'; } };

let isTextMode = false;
let isRecording = false;

/* 還原上次對話紀錄 */
chatHistory.forEach(m => appendMsg(m.content, m.role === 'user'));

function enterTextMode(){
  isTextMode = true;
  voiceBtn.style.display = 'none';
  textBox.classList.add('active');
  emojiPanel.classList.remove('show'); moreMenu.classList.remove('show');
  textInput.focus();
}
function exitTextMode(){
  if (textInput.value.trim() !== '') return;
  isTextMode = false;
  voiceBtn.style.display = '';
  textBox.classList.remove('active');
}
keyBtn.onclick = () => { if (!isRecording) enterTextMode(); };
textInput.addEventListener('blur', exitTextMode);

/* + 選單：貼輸入列下方彈出 */
plusBtn.onclick = (e) => {
  e.stopPropagation();
  moreMenu.classList.toggle('show');
  emojiPanel.classList.remove('show');
};
emojiBtn.onclick = (e) => {
  e.stopPropagation();
  emojiPanel.classList.toggle('show');
  moreMenu.classList.remove('show');
};
document.body.addEventListener('click', (e) => {
  if (!moreMenu.contains(e.target) && e.target !== plusBtn) moreMenu.classList.remove('show');
  if (!emojiPanel.contains(e.target) && e.target !== emojiBtn) emojiPanel.classList.remove('show');
});

document.querySelectorAll('.emoji').forEach(el => {
  el.onclick = () => { textInput.value += el.dataset.emo; emojiPanel.classList.remove('show'); enterTextMode(); };
});

/* 發送：發送鍵在框內 */
sendBtn.onclick = () => {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = '';
  exitTextMode();
  sendToAI(text);
};
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendBtn.click(); });

function appendMsg(text, isSelf){
  const div = document.createElement('div');
  div.className = isSelf ? 'msg me' : 'msg ai';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerText = text;
  div.appendChild(b);
  msgBox.appendChild(div);
  msgBox.scrollTop = msgBox.scrollHeight;
  return div;
}

function addLoading(){
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  msgBox.appendChild(div);
  msgBox.scrollTop = msgBox.scrollHeight;
  return div;
}

/* ===== 對話：串 Gemini（Key 從設定讀，存在本地） ===== */
async function sendToAI(userText){
  appendMsg(userText, true);
  chatHistory.push({ role: 'user', content: userText });
  localStorage.setItem('xiaomi_history', JSON.stringify(chatHistory));

  if (!appConfig.geminiKey && !appConfig.openaiKey && !appConfig.deepseekKey){
    appendMsg('請先到右上角 ⚙️ 設定填入 API Key', false);
    return;
  }
  const loadingEl = addLoading();

  try {
    let reply;
    if (appConfig.provider === 'gemini'){
      reply = await callGemini(userText);
    } else {
      reply = '目前僅接通 Gemini，OpenAI / DeepSeek 待接入';
    }
    loadingEl.remove();
    appendMsg(reply, false);
    chatHistory.push({ role: 'assistant', content: reply });
    localStorage.setItem('xiaomi_history', JSON.stringify(chatHistory));
  } catch (err) {
    loadingEl.remove();
    appendMsg('連線失敗：' + err.message, false);
  }
}

async function callGemini(userText){
  const key = appConfig.geminiKey;
  const sys = '你是「小祕」，一位可愛的鄰家女孩 AI 秘書。請用自然台灣繁體中文簡短回覆（1到3句話）。';
  const contents = [{ role: 'user', parts: [{ text: sys }] }]
    .concat(chatHistory.slice(-10).map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.content }] })));
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
  if (!parts || !parts[0] || !parts[0].text) throw new Error('沒有回覆內容');
  return parts[0].text.trim();
}

/* 長按錄音；單點才切文字。辨識完直接送 AI */
let speechRec = null;
function initRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const rec = new SR();
  rec.lang = appConfig.voice || 'zh-TW';
  rec.continuous = false;
  rec.interimResults = false;
  rec.onresult = e => {
    const text = e.results[0][0].transcript;
    if (text.trim()) sendToAI(text.trim());
  };
  rec.onerror = () => appendMsg('語音辨識失敗，請改打字', false);
  return rec;
}
voiceBtn.addEventListener('touchstart', e => { e.preventDefault(); startRecord(); }, { passive:false });
voiceBtn.addEventListener('touchend', e => { e.preventDefault(); stopRecord(); });
voiceBtn.addEventListener('touchcancel', () => stopRecord());
voiceBtn.addEventListener('mousedown', startRecord);
voiceBtn.addEventListener('mouseup', stopRecord);
voiceBtn.addEventListener('mouseleave', stopRecord);

function startRecord(){
  if (isRecording) return;
  isRecording = true;
  voiceBtn.textContent = '錄音中…';
  voiceBtn.style.background = '#ffe3e0';
  speechRec = initRecognition();
  if (speechRec) { try { speechRec.start(); } catch (err) { /* 已啟動 */ } }
}
function stopRecord(){
  if (!isRecording) return;
  isRecording = false;
  voiceBtn.textContent = '按住 說話';
  voiceBtn.style.background = '';
  if (speechRec) { try { speechRec.stop(); } catch (err) { /* 已停止 */ } }
}

/* ===== + 選單四項 ===== */
const pickPhoto = document.getElementById('pickPhoto');
const takePhoto = document.getElementById('takePhoto');
const skinBtn = document.getElementById('skinBtn');
const openSettings = document.getElementById('openSettings');

/* 圖庫：選圖後先當作小祕立繪預覽，換裝後續接 */
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  charImg.src = url;
  charImg.classList.remove('broken');
  charPlaceholder.style.display = 'none';
  fileInput.value = '';
});
/* 相機：拍完同樣先預覽到角色區 */
camInput.addEventListener('change', () => {
  const f = camInput.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  charImg.src = url;
  charImg.classList.remove('broken');
  charPlaceholder.style.display = 'none';
  camInput.value = '';
});

pickPhoto.onclick = () => { fileInput.click(); moreMenu.classList.remove('show'); };
takePhoto.onclick = () => { camInput.click(); moreMenu.classList.remove('show'); };
skinBtn.onclick = () => { fileInput.click(); moreMenu.classList.remove('show'); };

/* ===== 設定彈窗：開 / 關 / 讀存 ===== */
const closeSettings = document.getElementById('closeSettings');

function openSettingsModal(){
  moreMenu.classList.remove('show');
  emojiPanel.classList.remove('show');
  document.getElementById('cfg-provider').value = appConfig.provider;
  document.getElementById('cfg-gemini-key').value = appConfig.geminiKey;
  document.getElementById('cfg-openai-key').value = appConfig.openaiKey;
  document.getElementById('cfg-deepseek-key').value = appConfig.deepseekKey;
  document.getElementById('cfg-tts').value = appConfig.tts;
  document.getElementById('cfg-voice').value = appConfig.voice;
  document.getElementById('cfg-img-work').value = appConfig.imgWork;
  document.getElementById('cfg-img-home').value = appConfig.imgHome;
  document.getElementById('cfg-sticker-prefix').value = appConfig.stickerPrefix;
  document.getElementById('cfg-wake').checked = appConfig.wake;
  document.getElementById('cfg-auto').checked = appConfig.auto;
  document.getElementById('cfg-refresh').value = appConfig.refresh;
  document.getElementById('cfg-anim').value = appConfig.anim;
  document.getElementById('cfg-badge').checked = appConfig.badge;
  settingsModal.classList.add('active');
}
function closeSettingsModal(){ settingsModal.classList.remove('active'); }

openSettings.onclick = openSettingsModal;
closeSettings.onclick = closeSettingsModal;
settingsModal.addEventListener('click', e => { if (e.target === settingsModal) closeSettingsModal(); });

document.getElementById('saveSettings').onclick = () => {
  appConfig.provider = document.getElementById('cfg-provider').value;
  appConfig.geminiKey = document.getElementById('cfg-gemini-key').value.trim();
  appConfig.openaiKey = document.getElementById('cfg-openai-key').value.trim();
  appConfig.deepseekKey = document.getElementById('cfg-deepseek-key').value.trim();
  appConfig.tts = document.getElementById('cfg-tts').value;
  appConfig.voice = document.getElementById('cfg-voice').value;
  appConfig.imgWork = document.getElementById('cfg-img-work').value.trim();
  appConfig.imgHome = document.getElementById('cfg-img-home').value.trim();
  appConfig.stickerPrefix = document.getElementById('cfg-sticker-prefix').value.trim();
  appConfig.wake = document.getElementById('cfg-wake').checked;
  appConfig.auto = document.getElementById('cfg-auto').checked;
  appConfig.refresh = Number(document.getElementById('cfg-refresh').value) || 30;
  appConfig.anim = Number(document.getElementById('cfg-anim').value) || 0.5;
  appConfig.badge = document.getElementById('cfg-badge').checked;
  saveConfig();
  closeSettingsModal();
  appendMsg('設定已儲存', false);
};

document.getElementById('clearHistory').onclick = () => {
  chatHistory = [];
  localStorage.removeItem('xiaomi_history');
  msgBox.innerHTML = '';
  appendMsg('對話紀錄已清除', false);
};

/* 登入 / 雲端授權：後端未接，先占位提示 */
document.getElementById('loginBtn').onclick = () => alert('Google 登入待接入（需後端授權）');
document.getElementById('driveBtn').onclick = () => alert('雲端硬碟授權待接入（需後端授權）');

</script>
