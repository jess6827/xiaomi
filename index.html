<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小祕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
html,body{
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
}
.wrap{
  height:100%;
  display:flex;
  flex-direction:column;
}
.role-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#888;
  font-size:18px;
}
.history-btn{
  margin:12px 16px;
  padding:14px;
  background:rgba(40,40,48,0.55);
  border-radius:999px;
  text-align:center;
}
.msg-wrap{
  flex-shrink:0;
  padding:0 16px 12px;
  overflow-y:auto;
  max-height:28vh;
}
.msg-item{
  max-width:72%;
  padding:12px 16px;
  border-radius:18px;
  margin-bottom:10px;
  background:rgba(50,50,60,0.6);
  width:fit-content;
}
.msg-item.self{
  margin-left:auto;
  background:rgba(52,199,89,0.55);
}
.panel{
  background:rgba(24,24,30,0.92);
  padding:16px;
  display:none;
}
.panel.active{display:block}
.add-menu{
  display:flex;gap:32px;
  justify-content:center;
}
.add-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:14px;
  color:#fff;
}
.add-item .icon{
  width:48px;height:48px;
  border-radius:50%;
  background:rgba(60,60,72,0.65);
  display:grid;
  place-items:center;
  font-size:22px;
}
.emoji-row{
  display:flex;gap:14px;
}
.emoji{
  font-size:26px;
  padding:6px;
}
.input-row{
  display:flex;gap:10px;
  align-items:center;
  padding:10px 16px 22px;
  flex-shrink:0;
}
.btn{
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(50,50,60,0.55);
  color:white;
  border:none;
  font-size:20px;
  flex:0 0 44px;
}
textarea{
  min-height:44px;
  max-height:110px;
  border-radius:24px;
  padding:12px 16px;
  background:rgba(40,40,48,0.55);
  color:#fff;
  border:none;
  outline:none;
  font-size:16px;
  white-space:pre-wrap;
  resize:none;
  flex:1;
}
.send-btn{
  background:#34c759;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="role-area">【小祕 Live2D 角色區】</div>

  <div class="history-btn" id="historyBtn">▼ 歷史紀錄</div>

  <div class="msg-wrap" id="msgBox">
    <div class="msg-item">小祕：你好呀，我是小祕。</div>
  </div>

  <div class="panel" id="addPanel">
    <div class="add-menu">
      <div class="add-item" id="pickPhoto">
        <div class="icon">🖼</div>
        <span>相簿</span>
      </div>
      <div class="add-item" id="takePhoto">
        <div class="icon">📷</div>
        <span>拍照</span>
      </div>
    </div>
  </div>

  <div class="panel" id="emojiPanel">
    <div class="emoji-row">
      <span class="emoji" data-emo="😀">😀</span>
      <span class="emoji" data-emo="🥰">🥰</span>
      <span class="emoji" data-emo="😆">😆</span>
      <span class="emoji" data-emo="🤔">🤔</span>
      <span class="emoji" data-emo="👍">👍</span>
      <span class="emoji" data-emo="❤️">❤️</span>
    </div>
  </div>

  <div class="input-row">
    <button class="btn" id="voiceBtn">🎤</button>
    <textarea id="inputTxt" placeholder="輸入訊息..."></textarea>
    <button class="btn send-btn" id="sendBtn">➤</button>
    <button class="btn" id="emojiBtn">😊</button>
    <button class="btn" id="addBtn">+</button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>

<script>
const addPanel = document.getElementById('addPanel')
const emojiPanel = document.getElementById('emojiPanel')
const addBtn = document.getElementById('addBtn')
const emojiBtn = document.getElementById('emojiBtn')
const inputTxt = document.getElementById('inputTxt')
const msgBox = document.getElementById('msgBox')
const sendBtn = document.getElementById('sendBtn')
const pickPhoto = document.getElementById('pickPhoto')
const takePhoto = document.getElementById('takePhoto')
const fileInput = document.getElementById('fileInput')
const camInput = document.getElementById('camInput')
const voiceBtn = document.getElementById('voiceBtn')

let recorder = null
let audioStream = null

addBtn.onclick = ()=>{
  addPanel.classList.toggle('active')
  emojiPanel.classList.remove('active')
}
emojiBtn.onclick = ()=>{
  emojiPanel.classList.toggle('active')
  addPanel.classList.remove('active')
}
document.querySelectorAll('.emoji').forEach(el=>{
  el.onclick = ()=>{
    inputTxt.value += el.dataset.emo
    emojiPanel.classList.remove('active')
    inputTxt.focus()
  }
})
pickPhoto.onclick = ()=>{
  fileInput.click()
  addPanel.classList.remove('active')
}
takePhoto.onclick = ()=>{
  camInput.click()
  addPanel.classList.remove('active')
}

// 文字發送
sendBtn.onclick = ()=>{
  const text = inputTxt.value.trim()
  if(!text) return
  appendMsg(text,true)
  inputTxt.value = ''
}
inputTxt.addEventListener('keydown',e=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault()
    inputTxt.value += '\n'
  }
})

function appendMsg(text,isSelf){
  const div = document.createElement('div')
  div.className = isSelf ? 'msg-item self' : 'msg-item'
  div.innerText = text
  msgBox.appendChild(div)
  msgBox.scrollTop = msgBox.scrollHeight
}

// 按住麥克風錄音、放開送出（語音發送）
voiceBtn.addEventListener('mousedown',startRecord)
voiceBtn.addEventListener('mouseup',stopRecord)
voiceBtn.addEventListener('mouseleave',stopRecord)
// 手機觸控
voiceBtn.addEventListener('touchstart',(e)=>{e.preventDefault();startRecord()})
voiceBtn.addEventListener('touchend',(e)=>{e.preventDefault();stopRecord()})

async function startRecord(){
  try{
    audioStream = await navigator.mediaDevices.getUserMedia({audio:true})
    recorder = new MediaRecorder(audioStream)
    let chunks = []
    recorder.ondataavailable = e=>chunks.push(e.data)
    recorder.onstop = ()=>{
      // 這裡先模擬，後續再串轉文字API
      appendMsg('[語音訊息]',true)
      audioStream.getTracks().forEach(t=>t.stop())
    }
    recorder.start()
    voiceBtn.style.background = '#ff3b30'
  }catch(err){
    alert('沒有麥克風權限')
  }
}
function stopRecord(){
  if(recorder && recorder.state==='recording'){
    recorder.stop()
  }
  voiceBtn.style.background = ''
}
</script>
</body>
</html>
