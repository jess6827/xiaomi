<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#11131a" />
  <link rel="manifest" href="./manifest.json" />
  <title>小祕</title>
  <style>
    :root { --glass-bg: rgba(18, 20, 28, 0.65); --glass-border: rgba(255, 255, 255, 0.2); --accent: #ff7eb3; --accent-blue: #60a5fa; --text-main: #ffffff; --text-sub: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #161923; color: var(--text-main); }
    #scene-bg { position: fixed; inset: 0; background-size: cover; background-position: center; transition: background-image 0.8s ease; z-index: 1; }
    #scene-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 25%, transparent 70%, rgba(0,0,0,0.75) 100%); }
    #character-stage { position: fixed; inset: 0; display: flex; justify-content: center; align-items: flex-end; z-index: 2; pointer-events: none; padding-bottom: 70px; }
    @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes speak { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.015); } }
    #character-img { height: 84vh; max-width: 94vw; object-fit: contain; animation: breathe 4s ease-in-out infinite; }
    #character-img.speaking { animation: speak 0.55s ease-in-out infinite; }
    #top-bar { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; z-index: 10; gap: 6px; }
    .status-pill { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); padding: 6px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
    .top-actions { display: flex; gap: 6px; }
    .icon-btn { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); color: #fff; padding: 6px 11px; border-radius: 20px; font-size: 12px; cursor: pointer; }
    #history-dropdown { position: fixed; top: 54px; right: 14px; width: min(340px, calc(100vw - 28px)); max-height: 0; overflow: hidden; background: rgba(16, 18, 26, 0.92); backdrop-filter: blur(16px); border-radius: 16px; border: 1px solid transparent; z-index: 25; transition: max-height 0.3s ease, padding 0.2s; }
    #history-dropdown.open { max-height: 50vh; border-color: var(--glass-border); padding: 12px; overflow-y: auto; }
    .history-item { margin-bottom: 10px; font-size: 13px; line-height: 1.4; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .history-role { font-weight: bold; color: var(--accent); margin-right: 6px; }
    .history-role.user { color: var(--accent-blue); }
    #latest-bubble-wrap { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); width: min(480px, calc(100vw - 28px)); z-index: 8; display: flex; justify-content: center; pointer-events: none; }
    #latest-bubble { background: rgba(15, 17, 24, 0.8); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; text-align: center; pointer-events: auto; }
    #bottom-bar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(480px, calc(100vw - 24px)); height: 48px; background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 24px; display: flex; align-items: center; padding: 4px 6px; gap: 6px; z-index: 15; }
    .mode-toggle { width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 16px; cursor: pointer; flex-shrink: 0; }
    #text-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; padding: 0 10px; outline: none; user-select: text; -webkit-user-select: text; }
    #hold-talk-btn { flex: 1; height: 38px; border-radius: 19px; border: none; background: rgba(255,255,255,0.18); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #hold-talk-btn.recording { background: var(--accent); color: #111; }
    #hold-talk-btn.canceling { background: #ef4444; color: #fff; }
    #send-btn { height: 38px; padding: 0 16px; border-radius: 19px; border: none; background: var(--accent); color: #111; font-weight: bold; font-size: 14px; cursor: pointer; }
    #voice-overlay { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 17, 24, 0.9); border: 1px solid var(--glass-border); padding: 20px 26px; border-radius: 20px; text-align: center; z-index: 30; display: none; }
    #settings-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
    #settings-modal.show { display: flex; }
    .modal-card { background: #1e2230; border: 1px solid var(--glass-border); border-radius: 20px; width: min(420px, 100%); max-height: 85vh; overflow-y: auto; padding: 20px; user-select: text; -webkit-user-select: text; }
    .modal-title { font-size: 17px; font-weight: bold; margin-bottom: 14px; display: flex; justify-content: space-between; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; }
    .form-control { width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 9px 12px; color: #fff; font-size: 13px; outline: none; }
    .form-control option { background: #1e2230; color: #fff; }
    .btn-save { width: 100%; padding: 11px; border-radius: 12px; border: none; background: var(--accent); color: #111; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 6px; }
    .btn-danger { width: 100%; padding: 9px; border-radius: 12px; border: 1px solid #ef4444; background: rgba(239,68,68,0.2); color: #fca5a5; font-size: 13px; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="scene-bg"></div>
  <div id="character-stage"><img id="character-img" src="" alt="小祕" /></div>
  <div id="top-bar">
    <div class="status-pill"><span class="status-dot"></span><span id="schedule-status">載入中...</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="voice-quick-btn">🔊 Nova</button>
      <button class="icon-btn" id="sim-time-btn">換裝</button>
      <button class="icon-btn" id="history-toggle-btn">紀錄 ▾</button>
      <button class="icon-btn" id="settings-btn">⚙️</button>
    </div>
  </div>
  <div id="history-dropdown"></div>
  <div id="voice-overlay">
    <div style="font-size:28px; margin-bottom:6px;">🎙️</div>
    <div id="voice-status-text" style="font-weight:bold; margin-bottom:4px;">正在聆聽...</div>
    <div id="voice-hint-text" style="font-size:12px; color:var(--text-sub);">鬆開傳送，手指上滑取消</div>
  </div>
  <div id="latest-bubble-wrap"><div id="latest-bubble">早安！點擊右上角 ⚙️ 填入 API Key，我就能陪你聊天囉。</div></div>
  <div id="bottom-bar">
    <button class="mode-toggle" id="input-mode-btn">⌨️</button>
    <input type="text" id="text-input" placeholder="跟小祕說點什麼..." style="display:none;" />
    <button id="hold-talk-btn">按住 說話</button>
    <button id="send-btn" style="display:none;">傳送</button>
  </div>
  <div id="settings-modal">
    <div class="modal-card">
      <div class="modal-title"><span>小祕專屬設定</span><span id="close-settings" style="cursor:pointer;">✕</span></div>
      <div class="form-group"><label>對話大腦模型</label><select id="cfg-provider" class="form-control"><option value="openai">OpenAI (GPT-4o-mini)</option><option value="deepseek">DeepSeek (DeepSeek-Chat)</option></select></div>
      <div class="form-group"><label>OpenAI API Key（支援對話與 Nova 擬真女聲）</label><input type="password" id="cfg-openai-key" class="form-control" placeholder="sk-..." /></div>
      <div class="form-group"><label>DeepSeek API Key（選填）</label><input type="password" id="cfg-deepseek-key" class="form-control" placeholder="sk-..." /></div>
      <div class="form-group"><label>小祕聲音引擎（雙模式切換）</label><select id="cfg-tts-mode" class="form-control"><option value="openai-nova">OpenAI 擬真女聲（nova 聲線）</option><option value="browser-free">手機免費內建語言包（零花費）</option><option value="mute">靜音模式</option></select></div>
      <div class="form-group"><label>上班高馬尾全身立繪網址</label><input type="text" id="cfg-work-img" class="form-control" /></div>
      <div class="form-group"><label>居家長髮全身立繪網址</label><input type="text" id="cfg-home-img" class="form-control" /></div>
      <button class="btn-save" id="save-settings-btn">儲存設定</button>
      <button class="btn-danger" id="clear-history-btn">清空對話紀錄</button>
    </div>
  </div>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});
    var DEFAULT_CONFIG = {
      provider: "openai", openaiKey: "", deepseekKey: "", ttsMode: "openai-nova",
      workCharImg: "https://placehold.co",
      homeCharImg: "https://placehold.co",
      workBgImg: "https://unsplash.com",
      homeBgImg: "https://unsplash.com"
    };
    var savedCfg = JSON.parse(localStorage.getItem("xiaomi_cfg") || "{}");
    var appConfig = Object.assign({}, DEFAULT_CONFIG, savedCfg);
    var chatHistory = JSON.parse(localStorage.getItem("xiaomi_history") || "[]");
    var currentSchedule = "work", isVoiceInput = true, currentAudio = null;

    var sceneBg = document.getElementById("scene-bg"), charImg = document.getElementById("character-img");
    var scheduleStatus = document.getElementById("schedule-status"), voiceQuickBtn = document.getElementById("voice-quick-btn");
    var simTimeBtn = document.getElementById("sim-time-btn"), historyToggleBtn = document.getElementById("history-toggle-btn");
    var historyDropdown = document.getElementById("history-dropdown"), latestBubble = document.getElementById("latest-bubble");
    var inputModeBtn = document.getElementById("input-mode-btn"), textInput = document.getElementById("text-input");
    var holdTalkBtn = document.getElementById("hold-talk-btn"), sendBtn = document.getElementById("send-btn");
    var voiceOverlay = document.getElementById("voice-overlay"), voiceStatusText = document.getElementById("voice-status-text");
    var settingsBtn = document.getElementById("settings-btn"), settingsModal = document.getElementById("settings-modal");

    function checkTimeSchedule(autoGreet) {
      var now = new Date(), day = now.getDay(), timeVal = now.getHours() + now.getMinutes() / 60;
      applySchedule((day !== 0 && day !== 6 && timeVal >= 8.5 && timeVal < 18.0) ? "work" : "home", autoGreet);
    }
    function applySchedule(mode, greet) {
      currentSchedule = mode;
      scheduleStatus.textContent = mode === "work" ? "上班中 · 高馬尾" : "居家陪伴 · 長髮";
      var bgUrl = mode === "work" ? appConfig.workBgImg : appConfig.homeBgImg;
      sceneBg.style.backgroundImage = "url('" + bgUrl + "')";
      charImg.src = mode === "work" ? appConfig.workCharImg : appConfig.homeCharImg;
      if (greet && chatHistory.length === 0) {
        addMessage("小祕", mode === "work" ? "早安！現在是工作時段，有什麼需要我幫你處理的嗎？" : "辛苦啦！回到家就好好放鬆吧，今天過得還順利嗎？", false);
      }
    }
    simTimeBtn.addEventListener("click", function() {
      var next = currentSchedule === "work" ? "home" : "work";
      applySchedule(next, false);
      addMessage("小祕", next === "work" ? "換好上班套裝囉，我們開始吧！" : "換上居家服舒服多了～想聊點什麼呢？", true);
    });

    function updateVoiceQuickBtnUI() {
      voiceQuickBtn.textContent = appConfig.ttsMode === "openai-nova" ? "🔊 Nova" : (appConfig.ttsMode === "browser-free" ? "🔈 免費語音" : "🔇 靜音");
    }
    voiceQuickBtn.addEventListener("click", function() {
      var order = ["openai-nova", "browser-free", "mute"];
      appConfig.ttsMode = order[(order.indexOf(appConfig.ttsMode) + 1) % order.length];
      localStorage.setItem("xiaomi_cfg", JSON.stringify(appConfig));
      updateVoiceQuickBtnUI();
    });

    async function speakText(text) {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      window.speechSynthesis.cancel();
      charImg.classList.remove("speaking");
      if (appConfig.ttsMode === "mute") return;
      if (appConfig.ttsMode === "openai-nova" && appConfig.openaiKey) {
        try {
          charImg.classList.add("speaking");
          var ttsUrl = "https://openai.com";
          var res = await fetch(ttsUrl, {
            method: "POST",
            headers: { "Authorization": "Bearer " + appConfig.openaiKey, "Content-Type": "application/json" },
            body: JSON.stringify({ model: "tts-1", input: text, voice: "nova", speed: 1.02 })
          });
          if (!res.ok) throw new Error("TTS Error");
          var url = URL.createObjectURL(await res.blob());
          currentAudio = new Audio(url);
          currentAudio.onended = function() { charImg.classList.remove("speaking"); URL.revokeObjectURL(url); };
          await currentAudio.play();
          return;
        } catch (e) {}
      }
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = "zh-TW"; utter.pitch = 1.08;
      utter.onstart = function() { charImg.classList.add("speaking"); };
      utter.onend = function() { charImg.classList.remove("speaking"); };
      window.speechSynthesis.speak(utter);
    }

    function renderHistory() {
      historyDropdown.innerHTML = "";
      chatHistory.forEach(function(item) {
        var div = document.createElement("div");
        div.className = "history-item";
        var roleCls = item.role === "user" ? "history-role user" : "history-role";
        var roleName = item.role === "user" ? "你" : "小祕";
        div.innerHTML = "<span class='" + roleCls + "'>" + roleName + "</span><span style='color:#888;font-size:11px;'>" + item.time + "</span><div>" + item.content + "</div>";
        historyDropdown.appendChild(div);
      });
      if (chatHistory.length > 0) latestBubble.textContent = chatHistory[chatHistory.length - 1].content;
    }
    function addMessage(sender, content, shouldSpeak) {
      var role = sender === "你" ? "user" : "assistant";
      var time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      chatHistory.push({ role: role, content: content, time: time });
      if (chatHistory.length > 60) chatHistory.shift();
      localStorage.setItem("xiaomi_history", JSON.stringify(chatHistory));
      latestBubble.textContent = content;
      renderHistory();
      if (shouldSpeak && role === "assistant") speakText(content);
    }

    historyToggleBtn.addEventListener("click", function(e) {
      e.stopPropagation();
      var isOpen = historyDropdown.classList.toggle("open");
      historyToggleBtn.textContent = isOpen ? "紀錄 ▴" : "紀錄 ▾";
    });
    document.addEventListener("click", function(e) {
      if (!historyDropdown.contains(e.target) && e.target !== historyToggleBtn) {
        historyDropdown.classList.remove("open");
        historyToggleBtn.textContent = "紀錄 ▾";
      }
    });

    function syncInputBar() {
      inputModeBtn.textContent = isVoiceInput ? "⌨️" : "🎙️";
      textInput.style.display = isVoiceInput ? "none" : "block";
      sendBtn.style.display = isVoiceInput ? "none" : "block";
      holdTalkBtn.style.display = isVoiceInput ? "flex" : "none";
    }
    inputModeBtn.addEventListener("click", function() { isVoiceInput = !isVoiceInput; syncInputBar(); });

    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var recognition = SpeechRecognition ? new SpeechRecognition() : null;
    var speechBuffer = "", isRecording = false, isCanceled = false, touchStartY = 0;
    if (recognition) {
      recognition.lang = "zh-TW"; recognition.continuous = true; recognition.interimResults = true;
      recognition.onresult = function(e) {
        var interim = "";
        for (var i = e.resultIndex; i < e.results.length; i++) interim += e.results[i].transcript;
        speechBuffer = interim;
        if (!isCanceled && speechBuffer) voiceStatusText.textContent = speechBuffer;
      };
    }
    function beginHold(y) {
      isRecording = true; isCanceled = false; speechBuffer = ""; touchStartY = y;
      holdTalkBtn.classList.add("recording"); holdTalkBtn.classList.remove("canceling");
      holdTalkBtn.textContent = "鬆開 傳送"; voiceOverlay.style.display = "block";
      voiceStatusText.textContent = "正在聆聽...";
      if (recognition) try { recognition.start(); } catch (e) {}
    }
    function moveHold(y) {
      if (!isRecording) return;
      if (touchStartY - y > 55) {
        isCanceled = true; holdTalkBtn.classList.add("canceling"); holdTalkBtn.textContent = "鬆開 取消";
        voiceStatusText.textContent = "已取消發送";
      } else {
        isCanceled = false; holdTalkBtn.classList.remove("canceling"); holdTalkBtn.textContent = "鬆開 傳送";
        voiceStatusText.textContent = speechBuffer || "正在聆聽...";
      }
    }
    function endHold() {
      if (!isRecording) return;
      isRecording = false; holdTalkBtn.classList.remove("recording", "canceling");
      holdTalkBtn.textContent = "按住 說話"; voiceOverlay.style.display = "none";
      if (recognition) try { recognition.stop(); } catch (e) {}
      if (!isCanceled) setTimeout(function() { if (speechBuffer.trim()) sendToAI(speechBuffer.trim()); }, 300);
    }
    holdTalkBtn.addEventListener("touchstart", function(e) { e.preventDefault(); beginHold(e.touches[0].clientY); }, { passive: false });
    holdTalkBtn.addEventListener("touchmove", function(e) { e.preventDefault(); moveHold(e.touches[0].clientY); }, { passive: false });
    holdTalkBtn.addEventListener("touchend", function(e) { e.preventDefault(); endHold(); });
    holdTalkBtn.addEventListener("mousedown", function(e) { beginHold(e.clientY); });
    window.addEventListener("mousemove", function(e) { moveHold(e.clientY); });
    window.addEventListener("mouseup", function() { endHold(); });

    sendBtn.addEventListener("click", function() { if (textInput.value.trim()) { sendToAI(textInput.value.trim()); textInput.value = ""; } });
    textInput.addEventListener("keydown", function(e) { if (e.key === "Enter") sendBtn.click(); });
    async function sendToAI(userText) {
      addMessage("你", userText, false);
      var isDS = appConfig.provider === "deepseek";
      var apiKey = isDS ? appConfig.deepseekKey : appConfig.openaiKey;
      if (!apiKey) { addMessage("小祕", "請先點右上角 ⚙️ 填入 API Key 喔！", true); return; }
      latestBubble.textContent = "小祕思考中...";
      var stateCtx = currentSchedule === "work" ? "現在是白天上班時間，你綁著露額頭高馬尾在辦公室。" : "現在是下班居家時間，你放下一頭長髮在家陪伴對方。";
      var sysPrompt = "你是「小祕」，一位真實可愛的鄰家女孩AI秘書兼伴侶。" + stateCtx + "請用自然台灣繁體中文簡短回覆（1到3句話）。";
      var apiUrl = isDS ? "https://deepseek.com" : "https://openai.com";
      var recentMsgs = [{ role: "system", content: sysPrompt }].concat(chatHistory.slice(-10).map(function(m) { return { role: m.role, content: m.content }; }));
      try {
        var res = await fetch(apiUrl, {
          method: "POST",
          headers: { "Authorization": "Bearer " + apiKey, "Content-Type": "application/json" },
          body: JSON.stringify({ model: isDS ? "deepseek-chat" : "gpt-4o-mini", messages: recentMsgs })
        });
        var data = await res.json();
        if (data.error) throw new Error(data.error.message);
        addMessage("小祕", data.choices.message.content.trim(), true);
      } catch (err) {
        addMessage("小祕", "連線失敗：" + err.message, false);
      }
    }

    settingsBtn.addEventListener("click", function() {
      document.getElementById("cfg-provider").value = appConfig.provider;
      document.getElementById("cfg-openai-key").value = appConfig.openaiKey;
      document.getElementById("cfg-deepseek-key").value = appConfig.deepseekKey;
      document.getElementById("cfg-tts-mode").value = appConfig.ttsMode;
      document.getElementById("cfg-work-img").value = appConfig.workCharImg;
      document.getElementById("cfg-home-img").value = appConfig.homeCharImg;
      settingsModal.classList.add("show");
    });
    document.getElementById("close-settings").addEventListener("click", function() { settingsModal.classList.remove("show"); });
    document.getElementById("save-settings-btn").addEventListener("click", function() {
      appConfig.provider = document.getElementById("cfg-provider").value;
      appConfig.openaiKey = document.getElementById("cfg-openai-key").value.trim();
      appConfig.deepseekKey = document.getElementById("cfg-deepseek-key").value.trim();
      appConfig.ttsMode = document.getElementById("cfg-tts-mode").value;
      appConfig.workCharImg = document.getElementById("cfg-work-img").value.trim() || DEFAULT_CONFIG.workCharImg;
      appConfig.homeCharImg = document.getElementById("cfg-home-img").value.trim() || DEFAULT_CONFIG.homeCharImg;
      localStorage.setItem("xiaomi_cfg", JSON.stringify(appConfig));
      updateVoiceQuickBtnUI(); applySchedule(currentSchedule, false);
      settingsModal.classList.remove("show");
      addMessage("小祕", "設定都幫你更新好囉！", true);
    });
    document.getElementById("clear-history-btn").addEventListener("click", function() {
      chatHistory = []; localStorage.removeItem("xiaomi_history"); renderHistory();
      latestBubble.textContent = "對話紀錄已清空！"; settingsModal.classList.remove("show");
    });

    syncInputBar(); updateVoiceQuickBtnUI(); renderHistory(); checkTimeSchedule(true);
    setInterval(function() { checkTimeSchedule(false); }, 60000);
  </script>
</body>
</html>
