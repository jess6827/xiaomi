<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小祕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{
  background:#f2f4f7;
  padding:16px;
  padding-bottom:140px;
}
.anim-area{
  text-align:center;
  color:#b8c2cc;
  font-size:15px;
  margin-bottom:12px;
}
.chat-wrap{
  background:#ffffff;
  border-radius:28px;
  padding:20px;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
  margin-bottom:12px;
}
.chat-header{
  text-align:center;
  font-size:17px;
  color:#666;
  margin-bottom:18px;
  cursor:pointer;
}
.chat-box{
  display:flex;
  flex-direction:column;
  gap:14px;
  max-height:420px;
  overflow-y:auto;
}
.msg{
  max-width:82%;
  padding:14px 16px;
  border-radius:22px;
  line-height:1.55;
  font-size:16px;
}
.msg.user{
  background:#22c55e;
  color:#fff;
  align-self:flex-end;
  border-bottom-right-radius:6px;
}
.msg.ai{
  background:#f1f1f1;
  color:#222;
  align-self:flex-start;
  border-bottom-left-radius:6px;
}
.dot-wrap{
  display:flex;
  gap:6px;
  padding:12px 16px;
  align-self:flex-start;
}
.dot{
  width:10px;height:10px;
  background:#60a5fa;
  border-radius:50%;
  animation:bounce 1.4s infinite ease-in-out;
}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{
  0%,80%,100%{transform:scale(0.7)}
  40%{transform:scale(1.1)}
}
.ctrl-bar{
  background:#fff;
  border-radius:28px;
  padding:18px 12px;
  display:flex;
  justify-content:space-around;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
  margin-bottom:12px;
}
.ctrl-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  font-size:14px;
  color:#444;
  cursor:pointer;
}
.ctrl-icon{
  width:54px;height:54px;
  background:#f3f4f6;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.input-wrap{
  position:fixed;
  left:16px;right:16px;bottom:16px;
  background:#fff;
  border-radius:28px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}
#voiceHoldBtn{
  flex:1;
  padding:11px 0;
  background:#f7f8fa;
  border-radius:14px;
  text-align:center;
  font-size:17px;
  color:#333;
  user-select:none;
}
.icon-btn{
  width:38px;height:38px;
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-mask{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.5);
  display:none;align-items:center;justify-content:center;
  z-index:999;padding:24px;
}
.modal-box{
  width:100%;
  background:#fff;
  border-radius:28px;
  padding:30px;
}
.modal-title{
  font-size:22px;margin-bottom:22px;
}
.modal-input{
  width:100%;
  border:none;border-bottom:1px solid #ccc;
  font-size:17px;padding:10px 0;outline:none;
  margin-bottom:26px;
}
.modal-row{
  display:flex;justify-content:flex-end;gap:28px;
}
.modal-btn{
  font-size:18px;border:none;background:transparent;
  color:#2563eb;cursor:pointer;
}
</style>
</head>
<body>
<div class="anim-area">【小祕半身動畫區】</div>

<div class="chat-wrap">
  <div class="chat-header" id="historyToggle">▼ 歷史紀錄</div>
  <div class="chat-box" id="chat"></div>
</div>

<div class="ctrl-bar">
  <div class="ctrl-item" onclick="openCam()">
    <div class="ctrl-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
        <circle cx="12" cy="13" r="3"/>
      </svg>
    </div>
    <span>相機</span>
  </div>
  <div class="ctrl-item" onclick="openGallery()">
    <div class="ctrl-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </div>
    <span>圖庫</span>
  </div>
  <div class="ctrl-item" onclick="changeSkin()">
    <div class="ctrl-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <span>皮膚</span>
  </div>
  <div class="ctrl-item" onclick="openSetting()">
    <div class="ctrl-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>
    <span>設定</span>
  </div>
</div>

<div class="input-wrap">
  <button class="icon-btn" id="keyboardBtn" aria-label="鍵盤">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2"/>
      <line x1="6" y1="9" x2="6.01" y2="9"/>
      <line x1="10" y1="9" x2="10.01" y2="9"/>
      <line x1="14" y1="9" x2="14.01" y2="9"/>
      <line x1="18" y1="9" x2="18.01" y2="9"/>
      <line x1="7" y1="13" x2="17" y2="13"/>
    </svg>
  </button>
  <div id="voiceHoldBtn">按住 說話</div>
  <button class="icon-btn" id="emojiBtn" aria-label="表情">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
      <line x1="9" y1="9" x2="9.01" y2="9"/>
      <line x1="15" y1="9" x2="15.01" y2="9"/>
    </svg>
  </button>
  <button class="icon-btn" id="addBtn" aria-label="新增">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>

<div class="modal-mask" id="settingModal">
  <div class="modal-box">
    <div class="modal-title">請輸入 Gemini API Key：</div>
    <input class="modal-input" id="apiKeyInput" type="text">
    <div class="modal-row">
      <button class="modal-btn" onclick="closeModal()">取消</button>
      <button class="modal-btn" onclick="saveApiKey()">確定</button>
    </div>
  </div>
</div>

<script>
const chatBox = document.getElementById('chat');
const historyToggle = document.getElementById('historyToggle');
const settingModal = document.getElementById('settingModal');
let historyOpen = true;

historyToggle.onclick = ()=>{
  historyOpen = !historyOpen;
  chatBox.style.display = historyOpen ? 'flex' : 'none';
  historyToggle.innerText = historyOpen ? '▼ 歷史紀錄' : '▶ 歷史紀錄';
}

function openSetting(){
  settingModal.style.display = 'flex';
}
function closeModal(){
  settingModal.style.display = 'none';
}
function saveApiKey(){
  const key = document.getElementById('apiKeyInput').value.trim();
  localStorage.setItem('gemini_key', key);
  closeModal();
}
function openCam(){}
function openGallery(){}
function changeSkin(){}

// 載入動畫
function showLoading(){
  const div = document.createElement('div');
  div.className = 'dot-wrap';
  div.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}
function addMsg(text, isUser){
  const div = document.createElement('div');
  div.className = 'msg ' + (isUser ? 'user' : 'ai');
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// 語音按住邏輯
const voiceBtn = document.getElementById('voiceHoldBtn');
let isHold = false;
voiceBtn.addEventListener('touchstart',()=>{
  isHold = true;
  voiceBtn.innerText = '放開 結束';
})
voiceBtn.addEventListener('touchend',()=>{
  isHold = false;
  voiceBtn.innerText = '按住 說話';
  addMsg('我', true);
  const load = showLoading();
  setTimeout(()=>{
    load.remove();
    addMsg('請先點設定填入 API Key！', false);
  },1200)
})
</script>
</body>
</html>
