<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小祕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{
  background:#000;
  color:#fff;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
/* 角色區 */
.role-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#888;
  font-size:18px;
}
/* 歷史紀錄按鈕 */
.history-btn{
  margin:12px 16px;
  padding:14px;
  background:rgba(40,40,48,0.55);
  border-radius:999px;
  text-align:center;
}
/* 訊息區 */
.msg-wrap{
  flex:0 0 auto;
  padding:0 16px 12px;
  overflow-y:auto;
}
.msg-item{
  max-width:75%;
  padding:12px 16px;
  border-radius:18px;
  margin-bottom:10px;
  background:rgba(50,50,60,0.6);
}
/* 選單面板（+、表情） */
.panel{
  background:rgba(30,30,36,0.9);
  padding:18px;
  display:none;
}
.panel.active{display:block}
.add-menu{
  display:flex;gap:24px;
  justify-content:center;
}
.add-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.emoji-row{
  display:flex;gap:12px;
}
.emoji{
  font-size:26px;
  padding:4px;
}
/* 底部輸入列 */
.input-row{
  display:flex;gap:10px;
  align-items:center;
  padding:10px 16px 16px;
}
.btn{
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(50,50,60,0.55);
  color:white;
  border:none;
  font-size:20px;
}
textarea{
  flex:1;
  min-height:44px;
  max-height:120px;
  border-radius:24px;
  padding:12px 16px;
  background:rgba(40,40,48,0.55);
  color:#fff;
  border:none;
  outline:none;
  font-size:16px;
  /* 重點：換行，不要單行 */
  white-space:pre-wrap;
}
.send-btn{
  background:#34c759;
}
</style>
</head>
<body>
<div class="role-area">【小祕 Live2D 角色區】</div>

<div class="history-btn" id="historyBtn">▼ 歷史紀錄</div>

<div class="msg-wrap" id="msgBox">
  <div class="msg-item">小祕：你好呀，我是小祕。</div>
</div>

<!-- + 附加選單 -->
<div class="panel" id="addPanel">
  <div class="add-menu">
    <div class="add-item" id="pickPhoto">📷<span>相簿</span></div>
    <div class="add-item" id="takePhoto">📸<span>拍照</span></div>
  </div>
</div>

<!-- 表情面板 -->
<div class="panel" id="emojiPanel">
  <div class="emoji-row">
    <span class="emoji" data-emo="😀">😀</span>
    <span class="emoji" data-emo="🥰">🥰</span>
    <span class="emoji" data-emo="😆">😆</span>
    <span class="emoji" data-emo="🤔">🤔</span>
    <span class="emoji" data-emo="👍">👍</span>
    <span class="emoji" data-emo="❤️">❤️</span>
  </div>
</div>

<!-- 輸入列 -->
<div class="input-row">
  <button class="btn" id="voiceBtn">⌨</button>
  <textarea id="inputTxt" placeholder="輸入訊息..."></textarea>
  <button class="btn send-btn" id="sendBtn">➤</button>
  <button class="btn" id="emojiBtn">😊</button>
  <button class="btn" id="addBtn">+</button>
</div>

<!-- 隱藏檔案輸入 -->
<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>

<script>
const addPanel = document.getElementById('addPanel')
const emojiPanel = document.getElementById('emojiPanel')
const addBtn = document.getElementById('addBtn')
const emojiBtn = document.getElementById('emojiBtn')
const inputTxt = document.getElementById('inputTxt')
const msgBox = document.getElementById('msgBox')
const sendBtn = document.getElementById('sendBtn')
const pickPhoto = document.getElementById('pickPhoto')
const takePhoto = document.getElementById('takePhoto')
const fileInput = document.getElementById('fileInput')
const camInput = document.getElementById('camInput')

// 切換 + 選單，關閉表情
addBtn.onclick = ()=>{
  addPanel.classList.toggle('active')
  emojiPanel.classList.remove('active')
}
// 切換表情，關閉+選單
emojiBtn.onclick = ()=>{
  emojiPanel.classList.toggle('active')
  addPanel.classList.remove('active')
}
// 點表情貼上
document.querySelectorAll('.emoji').forEach(el=>{
  el.onclick = ()=>{
    inputTxt.value += el.dataset.emo
    emojiPanel.classList.remove('active')
    inputTxt.focus()
  }
})
// 相簿
pickPhoto.onclick = ()=>{
  fileInput.click()
  addPanel.classList.remove('active')
}
// 拍照
takePhoto.onclick = ()=>{
  camInput.click()
  addPanel.classList.remove('active')
}
// 發送
sendBtn.onclick = ()=>{
  const text = inputTxt.value.trim()
  if(!text) return
  msgBox.innerHTML += `<div class="msg-item" style="margin-left:auto;background:#34c75988">${text}</div>`
  inputTxt.value = ''
}
// 換行：Enter 換行，Shift+Enter 也換行，只有點按鈕才送出
inputTxt.addEventListener('keydown',e=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault()
    sendBtn.click()
  }
})
</script>
</body>
</html>
