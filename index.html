<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小祕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html{color-scheme: light;}
body{
  background:#f3f4f6;
  padding:16px;
  padding-bottom:100px;
}
.anim-area{
  text-align:center;
  color:#999;
  margin-bottom:12px;
  font-size:14px;
}
.history-header{
  background:#ffffff;
  border-radius:22px;
  padding:18px;
  text-align:center;
  font-size:16px;
  color:#666;
  cursor:pointer;
  box-shadow:0 2px 10px #00000012;
  margin-bottom:12px;
}
.history-wrap{
  background:#fff;
  border-radius:22px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 10px #00000012;
  display:none;
}
.chat-box{
  display:flex;
  flex-direction:column;
  gap:12px;
  max-height:320px;
  overflow-y:auto;
}
.msg{
  max-width:78%;
  padding:12px 14px;
  border-radius:16px;
  line-height:1.5;
  font-size:15px;
}
.msg.user{
  background:#22c55e;
  color:#fff;
  align-self:flex-end;
  border-bottom-right-radius:4px;
}
.msg.ai{
  background:#f1f1f1;
  color:#222;
  align-self:flex-start;
  border-bottom-left-radius:4px;
}
.ctrl-bar{
  display:flex;
  justify-content:space-around;
  background:#fff;
  border-radius:22px;
  padding:14px 8px;
  margin:12px 0;
  box-shadow:0 2px 10px #00000012;
}
.ctrl-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:#444;
  cursor:pointer;
}
.ctrl-icon{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.input-wrap{
  position:fixed;
  left:16px;
  right:16px;
  bottom:16px;
  background:#fff;
  border-radius:24px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:0 2px 12px #00000018;
}
#input{
  flex:1;
  border:none;
  outline:none;
  font-size:16px;
  padding:8px 4px;
  caret-color:#222;
  appearance:none;
}
#voiceBtn{
  width:44px;
  height:44px;
  border-radius:50%;
  border:none;
  background:#eeeeee;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
#sendBtn{
  width:44px;
  height:44px;
  border-radius:50%;
  border:none;
  background:#22c55e;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  display:none;
}
.voice-tip{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:12px 20px;
  border-radius:12px;
  display:none;
  white-space:nowrap;
}
.modal-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:24px;
}
.modal-box{
  width:100%;
  background:#fff;
  border-radius:24px;
  padding:28px;
}
.modal-title{
  font-size:20px;
  margin-bottom:20px;
}
.modal-input{
  width:100%;
  border:none;
  border-bottom:1px solid #ccc;
  font-size:16px;
  padding:8px 0;
  outline:none;
  margin-bottom:24px;
}
.modal-row{
  display:flex;
  justify-content:flex-end;
  gap:24px;
}
.modal-btn{
  font-size:17px;
  border:none;
  background:transparent;
  color:#2563eb;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="anim-area">【小祕半身動畫區】</div>

<div class="history-header" id="historyToggle">▼ 歷史紀錄</div>
<div class="history-wrap" id="historyBox">
  <div class="chat-box" id="chat"></div>
</div>

<div class="ctrl-bar">
  <div class="ctrl-item" onclick="openCam()">
    <div class="ctrl-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </div>
    <span>相機</span>
  </div>
  <div class="ctrl-item" onclick="openGallery()">
    <div class="ctrl-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </div>
    <span>圖庫</span>
  </div>
  <div class="ctrl-item" onclick="openSkin()">
    <div class="ctrl-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"></path>
      </svg>
    </div>
    <span>皮膚</span>
  </div>
  <div class="ctrl-item" onclick="openSetting()">
    <div class="ctrl-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>
    <span>設定</span>
  </div>
</div>

<div class="input-wrap">
  <button id="voiceBtn" aria-label="鍵盤">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2"/>
      <line x1="6" y1="9" x2="6.01" y2="9"/>
      <line x1="10" y1="9" x2="10.01" y2="9"/>
      <line x1="14" y1="9" x2="14.01" y2="9"/>
      <line x1="18" y1="9" x2="18.01" y2="9"/>
      <line x1="7" y1="13" x2="17" y2="13"/>
    </svg>
  </button>
  <input id="input" placeholder="輸入文字" oninput="switchBtn()">
  <button id="sendBtn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
    </svg>
  </button>
</div>

<div class="voice-tip" id="voiceTip">正在收聽...</div>

<div class="modal-mask" id="keyModal">
  <div class="modal-box">
    <div class="modal-title">請輸入 Gemini API Key：</div>
    <input class="modal-input" id="keyInput">
    <div class="modal-row">
      <button class="modal-btn" id="modalCancel">取消</button>
      <button class="modal-btn" id="modalOk">確定</button>
    </div>
  </div>
</div>

<script>
const chatBox = document.getElementById('chat');
const inputEl = document.getElementById('input');
const voiceBtn = document.getElementById('voiceBtn');
const sendBtn = document.getElementById('sendBtn');
const voiceTip = document.getElementById('voiceTip');
const historyToggle = document.getElementById('historyToggle');
const historyBox = document.getElementById('historyBox');
const keyModal = document.getElementById('keyModal');
const keyInput = document.getElementById('keyInput');
const modalCancel = document.getElementById('modalCancel');
const modalOk = document.getElementById('modalOk');
let apiKey = localStorage.getItem('geminiKey') || '';

// 歷史紀錄展開收合
historyToggle.onclick = ()=>{
  if(historyBox.style.display === 'block'){
    historyBox.style.display = 'none';
    historyToggle.innerText = '▼ 歷史紀錄';
  }else{
    historyBox.style.display = 'block';
    historyToggle.innerText = '▲ 歷史紀錄';
  }
}

function switchBtn(){
  if(inputEl.value.trim() !== ''){
    sendBtn.style.display = 'flex';
  }else{
    sendBtn.style.display = 'none';
  }
}

function addMsg(text, type){
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  inputEl.value = '';
  switchBtn();
  if(!apiKey){
    keyModal.style.display = 'flex';
    return;
  }
  addMsg('小祕正在思考...', 'ai');
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents: [{parts:[{text:text}]}]
      })
    })
    const data = await res.json();
    chatBox.lastChild.remove();
    if(data.candidates?.[0]?.content?.parts?.[0]?.text){
      addMsg(data.candidates[0].content.parts[0].text, 'ai');
    }else{
      addMsg('回應失敗，請檢查金鑰', 'ai');
    }
  }catch(e){
    chatBox.lastChild.remove();
    addMsg('連線錯誤', 'ai');
  }
}

sendBtn.onclick = sendMessage;
inputEl.onkeydown = (e)=>{
  if(e.key === 'Enter') sendMessage();
}

// 語音輸入
voiceBtn.onclick = async ()=>{
  if(!window.SpeechRecognition && !window.webkitSpeechRecognition){
    alert('瀏覽器不支援語音辨識');
    return;
  }
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new Rec();
  rec.lang = 'zh-TW';
  voiceTip.style.display = 'block';
  rec.start();
  rec.onresult = (e)=>{
    voiceTip.style.display = 'none';
    inputEl.value = e.results[0][0].transcript;
    switchBtn();
  }
  rec.onerror = ()=>{
    voiceTip.style.display = 'none';
  }
}

// 自訂金鑰彈窗
modalOk.onclick = ()=>{
  const val = keyInput.value.trim();
  if(val){
    apiKey = val;
    localStorage.setItem('geminiKey', apiKey);
  }
  keyModal.style.display = 'none';
}
modalCancel.onclick = ()=>{
  keyModal.style.display = 'none';
}

function openCam(){alert('相機功能')}
function openGallery(){alert('圖庫功能')}
function openSkin(){alert('換膚功能')}
function openSetting(){
  keyInput.value = apiKey;
  keyModal.style.display = 'flex';
}
</script>
</body>
</html>
