<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小祕</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html,body{
  height:100%;
  background:#f2f4f7;
  overflow:hidden;
  padding:16px;
  display:flex;
  flex-direction:column;
}
/* 小祕 固定6份 */
.anim-area{
  flex: 0 0 60%;
  background:#eef2f7;
  border-radius:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#888;
  margin-bottom:12px;
  flex-shrink:0;
  transition: 0.25s;
}
/* 下方容器：剩下40% */
.bottom-wrapper{
  flex: 1;
  display:flex;
  flex-direction:column;
  gap:12px;
  min-height:0;
  transition: 0.25s;
}
/* 歷史區塊 */
.chat-wrap{
  flex:1;
  background:#ffffff;
  border-radius:28px;
  padding:20px;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
  display:flex;
  flex-direction:column;
  min-height:80px;
  position:relative;
  transition: 0.25s;
}
.chat-header{
  text-align:center;
  font-size:17px;
  color:#666;
  margin-bottom:12px;
  cursor:pointer;
}
.chat-box{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:14px;
  overflow-y:auto;
}
/* 展開全螢幕歷史的三角按鈕 */
.expand-history-btn{
  text-align:center;
  margin-top:8px;
  color:#666;
  font-size:20px;
  cursor:pointer;
  user-select:none;
}
.msg{
  max-width:82%;
  padding:14px 16px;
  border-radius:22px;
  line-height:1.55;
  font-size:16px;
}
.msg.user{
  background:#22c55e;
  color:#fff;
  align-self:flex-end;
  border-bottom-right-radius:6px;
}
.msg.ai{
  background:#f1f1f1;
  color:#222;
  align-self:flex-start;
  border-bottom-left-radius:6px;
}
.dot-wrap{
  display:flex;
  gap:6px;
  padding:12px 16px;
  align-self:flex-start;
}
.dot{
  width:10px;height:10px;
  background:#60a5fa;
  border-radius:50%;
  animation:bounce 1.4s infinite ease-in-out;
}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{
  0%,80%,100%{transform:scale(0.7)}
  40%{transform:scale(1.1)}
}
/* 底部輸入區 */
.bottom-bar{
  display:flex;
  flex-direction:column-reverse;
  gap:12px;
  transition: height 0.25s ease;
  height:10vh;
}
.bottom-bar.open{
  height:20vh;
}
.ctrl-bar{
  background:#fff;
  border-radius:28px;
  padding:18px 12px;
  display:none;
  justify-content:space-around;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.ctrl-bar.show{
  display:flex;
}
.ctrl-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  font-size:14px;
  color:#444;
  cursor:pointer;
}
.ctrl-icon{
  width:54px;height:54px;
  background:#f3f4f6;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.input-wrap{
  background:#fff;
  border-radius:28px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  flex-shrink:0;
}
#voiceHoldBtn{
  flex:1;
  padding:11px 0;
  background:#f7f8fa;
  border-radius:14px;
  text-align:center;
  font-size:17px;
  color:#333;
  user-select:none;
}
.icon-btn{
  width:38px;height:38px;
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-mask{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.5);
  display:none;align-items:center;justify-content:center;
  z-index:999;padding:24px;
}
.modal-box{
  width:100%;
  background:#fff;
  border-radius:28px;
  padding:30px;
}
.modal-title{
  font-size:22px;margin-bottom:22px;
}
.modal-input{
  width:100%;
  border:none;border-bottom:1px solid #ccc;
  font-size:17px;padding:10px 0;outline:none;
  margin-bottom:26px;
}
.modal-row{
  display:flex;justify-content:flex-end;gap:28px;
}
.modal-btn{
  font-size:18px;border:none;background:transparent;
  color:#2563eb;cursor:pointer;
}
/* 全螢幕歷史模式 */
body.full-history{
  padding:0;
}
body.full-history .anim-area,
body.full-history .bottom-wrapper{
  display:none;
}
body.full-history .chat-wrap{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:10;
  border-radius:0;
}
</style>
</head>
<body>
<div class="anim-area">【小祕 6份區域】</div>

<div class="bottom-wrapper">
  <div class="chat-wrap" id="chatWrap">
    <div class="chat-header" id="historyToggle">▼ 歷史紀錄</div>
    <div class="chat-box" id="chat">
      <div class="msg user">幫我查一下彰化的天氣</div>
      <div class="dot-wrap">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div class="msg ai">好的，小祕正在為您查詢...</div>
      <div class="msg ai">辛苦啦！回到家就好好放鬆吧，今天過得還順利嗎？</div>
    </div>
    <div class="expand-history-btn" id="expandHistoryBtn">▼</div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <div class="ctrl-bar" id="ctrlBar">
      <div class="ctrl-item" onclick="openCam()">
        <div class="ctrl-icon">
          <i class="fa fa-camera" style="font-size:28px;color:#333"></i>
        </div>
        <span>相機</span>
      </div>
      <div class="ctrl-item" onclick="openGallery()">
        <div class="ctrl-icon">
          <i class="fa fa-picture-o" style="font-size:28px;color:#333"></i>
        </div>
        <span>圖庫</span>
      </div>
      <div class="ctrl-item" onclick="changeSkin()">
        <div class="ctrl-icon">
          <i class="fa fa-user" style="font-size:28px;color:#333"></i>
        </div>
        <span>皮膚</span>
      </div>
      <div class="ctrl-item" onclick="openSetting()">
        <div class="ctrl-icon">
          <i class="fa fa-cog" style="font-size:28px;color:#333"></i>
        </div>
        <span>設定</span>
      </div>
    </div>
    <div class="input-wrap">
      <button class="icon-btn" id="keyboardBtn" aria-label="鍵盤">
        <i class="fa fa-keyboard-o" style="font-size:26px;color:#333"></i>
      </button>
      <div id="voiceHoldBtn">按住 說話</div>
      <button class="icon-btn" id="emojiBtn" aria-label="表情">
        <i class="fa fa-smile-o" style="font-size:26px;color:#333"></i>
      </button>
      <button class="icon-btn" id="addBtn" aria-label="展開更多">
        <i class="fa fa-plus" style="font-size:26px;color:#333"></i>
      </button>
    </div>
  </div>
</div>

<div class="modal-mask" id="settingModal">
  <div class="modal-box">
    <div class="modal-title">請輸入 Gemini API Key：</div>
    <input class="modal-input" id="apiKeyInput" type="text">
    <div class="modal-row">
      <button class="modal-btn" onclick="closeModal()">取消</button>
      <button class="modal-btn" onclick="saveApiKey()">確定</button>
    </div>
  </div>
</div>

<script>
const chatBox = document.getElementById('chat');
const historyToggle = document.getElementById('historyToggle');
const settingModal = document.getElementById('settingModal');
const ctrlBar = document.getElementById('ctrlBar');
const addBtn = document.getElementById('addBtn');
const bottomBar = document.getElementById('bottomBar');
const expandHistoryBtn = document.getElementById('expandHistoryBtn');
let historyOpen = true;
let menuOpen = false;
let fullHistoryMode = false;

addBtn.onclick = ()=>{
  menuOpen = !menuOpen;
  ctrlBar.classList.toggle('show');
  bottomBar.classList.toggle('open');
}

historyToggle.onclick = ()=>{
  historyOpen = !historyOpen;
  chatBox.style.display = historyOpen ? 'flex' : 'none';
  historyToggle.innerText = historyOpen ? '▼ 歷史紀錄' : '▶ 歷史紀錄';
}

// 全螢幕歷史切換
expandHistoryBtn.onclick = ()=>{
  fullHistoryMode = !fullHistoryMode;
  document.body.classList.toggle('full-history', fullHistoryMode);
  expandHistoryBtn.innerText = fullHistoryMode ? '▲' : '▼';
}

function openSetting(){
  settingModal.style.display = 'flex';
}
function closeModal(){
  settingModal.style.display = 'none';
}
function saveApiKey(){
  const key = document.getElementById('apiKeyInput').value.trim();
  localStorage.setItem('gemini_key', key);
  closeModal();
}
function openCam(){}
function openGallery(){}
function changeSkin(){}

function showLoading(){
  const div = document.createElement('div');
  div.className = 'dot-wrap';
  div.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}
function addMsg(text, isUser){
  const div = document.createElement('div');
  div.className = 'msg ' + (isUser ? 'user' : 'ai');
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

const voiceBtn = document.getElementById('voiceHoldBtn');
let isHold = false;
voiceBtn.addEventListener('touchstart',()=>{
  isHold = true;
  voiceBtn.innerText = '放開 結束';
})
voiceBtn.addEventListener('touchend',()=>{
  isHold = false;
  voiceBtn.innerText = '按住 說話';
  addMsg('我', true);
  const load = showLoading();
  setTimeout(()=>{
    load.remove();
    addMsg('請先點設定填入 API Key！', false);
  },1200)
})
</script>
</body>
</html>
